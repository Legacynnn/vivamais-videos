</div><div data-hf-id="hf-91yl" class="hi"></div></div></div><div data-hf-id="hf-uywg" class="cur" id="f06-pix-cur" style="opacity:0"><div data-hf-id="hf-x558" class="d"></div><div data-hf-id="hf-1rbm" class="r"></div></div></div></div>
</div>
<script>
(function(){
const id='f06-pix';

const q=(s)=>document.querySelector(s);
const cur=q('#f06-pix-cur'), ring=q('#f06-pix-cur .r');
function curEnter(tl,x,y,at,dur=.85){ tl.fromTo(cur,{x:x,y:960,opacity:1},{x:x,y:y,duration:dur,ease:'power3.out',immediateRender:false},at); }
function curMove(tl,x,y,at,dur=.6){ tl.to(cur,{x:x,y:y,duration:dur,ease:'power3.inOut'},at); }
function curExit(tl,at,dur=.6){ tl.to(cur,{y:960,duration:dur,ease:'power3.in'},at); }
function tap(tl,at,target,pressScale=.97){
  tl.to(cur,{scale:.78,duration:.1,ease:'power2.in'},at);
  tl.to(cur,{scale:1,duration:.22,ease:'power2.out'},at+.1);
  tl.fromTo(ring,{scale:1,opacity:.7},{scale:2.4,opacity:0,duration:.5,ease:'power2.out',immediateRender:false},at+.05);
  if(target){ tl.to(target,{scale:pressScale,duration:.1,ease:'power2.in'},at); tl.to(target,{scale:1,duration:.28,ease:'back.out(1.6)'},at+.1); }
}
function nudge(tl,el,from,to,dur,at){ const d=to-from; tl.fromTo(el,{y:from},{y:from+d*.10,duration:dur*.12,ease:'power3.in',immediateRender:false},at); tl.to(el,{y:from+d*.75,duration:dur*.45,ease:'none'},at+dur*.12); tl.to(el,{y:to,duration:dur*.43,ease:'power4.out'},at+dur*.57); }
function iosPush(tl,prev,next,at,dur=.38){ tl.fromTo(next,{x:402},{x:0,duration:dur,ease:'power3.out',immediateRender:false},at); tl.fromTo(prev,{x:0,autoAlpha:1},{x:-120,duration:dur,ease:'power3.out',immediateRender:false},at); tl.set(prev,{autoAlpha:0},at+dur+.02); swing(tl,at,dur); }
function swing(tl,at,dur=.38){ tl.fromTo(dev,{rotationY:0,x:0},{rotationY:-9,x:-28,duration:dur*.55,ease:'power2.out',immediateRender:false},at); tl.to(dev,{rotationY:0,x:0,duration:dur*1.6,ease:'power3.out'},at+dur*.55); tl.to(q('.bloom'),{x:'-=90',duration:dur*2,ease:'power2.out'},at); }
function vignette(tl,el,at,dur=.38){ tl.fromTo(el,{backgroundColor:'rgba(0,0,0,0)'},{backgroundColor:'rgba(0,0,0,.18)',duration:dur,ease:'power2.out',immediateRender:false},at); }
function fadeUp(tl,els,at,stagger=.06,dist=18,dur=.32){ tl.fromTo(els,{y:dist,opacity:0},{y:0,opacity:1,duration:dur,ease:'power3.out',stagger:stagger,immediateRender:false},at); }

const tl = gsap.timeline({ paused: true });
const dev=q('#f06-pix-device'); gsap.set(dev,{scale:2.45,x:0,y:0,rotationY:0});

    gsap.set(q('#xp-pag > div:nth-of-type(2)'),{y:-90});
    tl.set(cur,{x:201,y:522,opacity:1},0);
    tap(tl,0,q('#xp-pix'),.98);
    iosPush(tl,q('#x-prev'),q('#x-next'),.08,.42);
    tl.to(cur,{opacity:0,duration:.2},.15);
    fadeUp(tl,['#x-amount','#x-steps','#x-sticky'],.4,.06,16,.32);
    curEnter(tl,201,654,1.2,.7);
    tap(tl,2.2,q('#x-bar'),.98);
    tl.set(q('#x-spin'),{display:'block'},2.35);
    tl.fromTo(q('#x-spin'),{rotation:0},{rotation:1440,duration:1.2,ease:'none',immediateRender:false},2.35);
    tl.to(cur,{y:960,duration:.5,ease:'power3.in'},2.5);
    // panel swap + scroll so the whole PixPanel is visible
    tl.to(q('#x-steps'),{opacity:0,y:-12,duration:.25,ease:'power2.in'},3.3);
    tl.to(q('#x-sticky'),{y:140,duration:.35,ease:'power3.in'},3.3);
    tl.fromTo(q('#x-panel'),{opacity:0,y:16},{opacity:1,y:0,duration:.35,ease:'power3.out',immediateRender:false},3.5);
    nudge(tl,q('#x-pagar > div:nth-of-type(2) > div'),0,-150,.7,3.5);
    // QR modules assemble in a diagonal wave
    const mods=Array.from(document.querySelectorAll('#x-qr .qm'));
    mods.forEach(el=>{ const d=+el.dataset.d; tl.fromTo(el,{opacity:0,scale:0},{opacity:1,scale:1,duration:.22,ease:'back.out(2)',immediateRender:false},3.75+d*0.0105); });
    // countdown ticks
    const cd={t:0}, cdEl=q('#x-cd');
    tl.to(cd,{t:8,duration:8,ease:'none',onUpdate:()=>{const r=900-Math.floor(cd.t);cdEl.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');}},3.5);
    // waiting dot pulse (finite)
    tl.fromTo(q('#x-wdot'),{opacity:1},{opacity:.3,duration:.7,ease:'sine.inOut',yoyo:true,repeat:5,immediateRender:false},3.9);
    // copy code
    curEnter(tl,120.75,598,4.4,.6);
    tap(tl,5.1,q('#x-copy'),.97);
    tl.to(q('#x-copy-a'),{opacity:0,duration:.12},5.15);
    tl.fromTo(q('#x-copy-b'),{opacity:0,y:6},{opacity:1,y:0,duration:.25,ease:'power3.out',immediateRender:false},5.2);
    tl.to(cur,{y:960,duration:.5,ease:'power3.in'},5.5);
    // scan sweep = the bank reading it
    tl.fromTo(q('#x-scan'),{y:0,opacity:0},{opacity:1,duration:.1,immediateRender:false},6.1);
    tl.to(q('#x-scan'),{y:270,duration:.7,ease:'power2.inOut'},6.15);
    tl.to(q('#x-scan'),{opacity:0,duration:.15},6.8);
    // stillness, then the screen recedes (Z pull) into the confirmation
    tl.to(dev,{scale:2.205,rotationX:-6,duration:.55,ease:'power3.in'},7.55);
  
window.__timelines['f06-pix'] = tl;
})();
</script>
