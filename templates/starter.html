<!DOCTYPE html>
<html lang="pt-BR" data-resolution="__RESOLUTION__">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="brand/tokens.css">
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/brand/fonts/SpaceGrotesk-Medium.ttf") format("truetype");
        font-style: normal;
        font-weight: 500;
      }

      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/brand/fonts/SpaceGrotesk-Bold.ttf") format("truetype");
        font-style: normal;
        font-weight: 700;
      }

      @font-face {
        font-family: "DM Sans";
        src: url("assets/brand/fonts/DMSans-Regular.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
      }

      @font-face {
        font-family: "DM Sans";
        src: url("assets/brand/fonts/DMSans-Medium.ttf") format("truetype");
        font-style: normal;
        font-weight: 500;
      }

      @font-face {
        font-family: "DM Sans";
        src: url("assets/brand/fonts/DMSans-Bold.ttf") format("truetype");
        font-style: normal;
        font-weight: 700;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root,
      .clip {
        width: 100%;
        height: 100%;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--viva-canvas);
      }

      #root {
        position: relative;
        overflow: hidden;
        color: var(--viva-ink-900);
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        padding: __SAFE_TOP__px __SAFE_RIGHT__px __SAFE_BOTTOM__px __SAFE_LEFT__px;
      }

      .logo {
        width: __LOGO_WIDTH__px;
        height: auto;
      }

      .eyebrow {
        margin: 0;
        color: var(--viva-violet-700);
        font-family: "DM Sans";
        font-size: __LABEL_SIZE__px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .title {
        max-width: __TITLE_WIDTH__px;
        margin: 26px 0 0;
        font-family: "Space Grotesk";
        font-size: __TITLE_SIZE__px;
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 0.94;
      }

      .copy {
        max-width: __COPY_WIDTH__px;
        margin: 34px 0 0;
        color: var(--viva-ink-600);
        font-family: "DM Sans";
        font-size: __COPY_SIZE__px;
        line-height: 1.3;
      }

      .spark {
        width: 120px;
        height: 10px;
        margin-top: 48px;
        border-radius: var(--viva-radius-chip);
        background: var(--viva-lime-400);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ai2c" id="root" data-composition-id="__COMPOSITION_ID__" data-start="0" data-duration="5" data-width="__WIDTH__" data-height="__HEIGHT__">
      <section data-hf-id="hf-qa95" id="starter-scene" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <main data-hf-id="hf-l4yq" class="stage">
          <img data-hf-id="hf-h2ou" class="logo" id="brand-logo" src="assets/brand/logo.svg" alt="Viva Mais">
          <div data-hf-id="hf-yeow">
            <p data-hf-id="hf-zt72" class="eyebrow" id="kicker">[Tema do vídeo]</p>
            <h1 data-hf-id="hf-0v6r" class="title" id="title">[Mensagem principal]</h1>
            <p data-hf-id="hf-eccl" class="copy" id="copy">[Apoio claro para mensagem.]</p>
            <div data-hf-id="hf-b0o8" class="spark" id="spark"></div>
          </div>
        </main>
      </section>
    </div>
    <script>
      const timeline = gsap.timeline({ paused: true });
      timeline
        .fromTo("#brand-logo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0.16)
        .fromTo("#kicker", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.36)
        .fromTo("#title", { opacity: 0, x: 72 }, { opacity: 1, x: 0, duration: 0.58, ease: "power4.out" }, 0.46)
        .fromTo("#copy", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.76)
        .fromTo("#spark", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.96);
      window.__timelines["__COMPOSITION_ID__"] = timeline;
    </script>
  </body>
</html>
