<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; font-weight: 700; font-display: block; src: url("assets/brand/fonts/SpaceGrotesk-Bold.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 400; font-display: block; src: url("assets/brand/fonts/DMSans-Regular.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/DMSans-Medium.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 700; font-display: block; src: url("assets/brand/fonts/DMSans-Bold.ttf") format("truetype"); }
        #ch01 { position: absolute; inset: 0; overflow: hidden; color: var(--vm-foreground); font-family: "DM Sans", sans-serif; }
      </style>
      <div id="ch01" data-composition-id="ch01" data-start="0" data-duration="16" data-width="__W__" data-height="__H__">
        <div id="c01-bg" class="clip" data-start="0" data-duration="16" data-track-index="0">
          <div class="backdrop"></div>
          <div class="grid"></div>
          <div class="glow glow-a"></div>
          <div class="glow glow-b"></div>
        </div>
        <img class="logo" src="assets/brand/lockup-cor.svg" alt="Viva Mais">

        <section id="c01-t1" class="clip chapter" data-start="0" data-duration="3" data-track-index="1">
          <div class="chapter-words">
            <div class="chapter-line"><span class="w">Entre</span><span class="w">na sua</span></div>
            <div class="chapter-line"><span class="w v">conta</span></div>
            <span class="chapter-spark"></span>
          </div>
        </section>

        <section id="c01-phone" class="clip" data-start="3" data-duration="13" data-track-index="2">
          <div class="cam" data-layout-allow-overflow>
            <div class="dev">
              <div class="bezel" data-layout-allow-occlusion data-layout-allow-overlap data-layout-allow-overflow></div>
              <div class="screen" data-layout-allow-overflow>
                <div class="island"></div>
                <div id="c01-sA" class="scr" data-layout-allow-overlap><!-- screen:account-type default --><!-- /screen --></div>
                <div id="c01-sB" class="scr" data-layout-allow-overlap><!-- screen:signin default --><!-- /screen --></div>
                <div id="c01-sC" class="scr" data-layout-allow-overlap><!-- screen:signin filled --><!-- /screen --></div>
              </div>
              <div class="lift"></div>
            </div>
          </div>
        </section>
      </div>
      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="ch01"]');
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const k = VMKit.create({ root, tl });
            const { $, tap, center, tip, showTip, titleCard } = k;
            const cam = $(".cam");

            k.screens(["c01-sA", "c01-sB", "c01-sC"]);
            titleCard("#c01-t1", { at: 0.15, sparkAt: 0.75, out: 2.58 });

            tl.fromTo(cam, { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 3);
            const patient = center('#c01-sA [aria-label="Criar conta como paciente"]');
            const t1 = tip("Escolha seu perfil", patient.x, patient.y + 178, "down");
            showTip(t1, 4.2, 2.2);
            tap(patient.x, patient.y, 6.6, '#c01-sA [aria-label="Criar conta como paciente"]');
            k.push("c01-sA", "c01-sB", 6.8);

            const email = center('#c01-sB [aria-label="E-mail"]');
            tap(email.x, email.y, 8.4, '#c01-sB [aria-label="E-mail"]');
            tl.set("#c01-sC", { x: 0, autoAlpha: 1 }, 9.6);
            tl.set("#c01-sB", { autoAlpha: 0 }, 9.6);
            const enter = center('#c01-sC [aria-label="Entrar"]');
            const t2 = tip("Entre na sua conta", enter.x, enter.y + 112, "down");
            showTip(t2, 10.4, 2.4);
            tap(enter.x, enter.y, 13.2, '#c01-sC [aria-label="Entrar"]');

            tl.to(cam, { xPercent: -24, opacity: 0, duration: 0.42, ease: "power4.in" }, 15.4);
            window.__timelines["ch01"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
