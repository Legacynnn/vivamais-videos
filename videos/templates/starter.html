<!DOCTYPE html>
<html lang="pt-BR" data-resolution="__RESOLUTION__">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand/tokens.css">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root,
      .clip {
        width: 100%;
        height: 100%;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        background: var(--vm-canvas);
      }

      #root {
        position: relative;
        overflow: hidden;
        color: var(--vm-foreground);
        font-family: var(--vm-font-text);
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        padding: __SAFE_TOP__px __SAFE_RIGHT__px __SAFE_BOTTOM__px __SAFE_LEFT__px;
      }

      .logo {
        width: __LOGO_WIDTH__px;
        height: auto;
      }

      .eyebrow {
        margin: 0;
        color: var(--vm-primary);
        font-size: __LABEL_SIZE__px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .title {
        max-width: __TITLE_WIDTH__px;
        margin: 26px 0 0;
        font-family: var(--vm-font-display);
        font-size: __TITLE_SIZE__px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 0.96;
      }

      .title em {
        color: var(--vm-primary);
        font-style: normal;
      }

      .copy {
        max-width: __COPY_WIDTH__px;
        margin: 34px 0 0;
        color: var(--vm-ink-600);
        font-size: __COPY_SIZE__px;
        line-height: 1.3;
      }

      .spark {
        width: 120px;
        height: 10px;
        margin-top: 48px;
        border-radius: var(--vm-radius-pill);
        background: var(--vm-secondary);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="__COMPOSITION_ID__" data-start="0" data-duration="5" data-width="__WIDTH__" data-height="__HEIGHT__">
      <section id="starter-scene" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <main class="stage">
          <img class="logo" id="brand-logo" src="assets/brand/lockup-cor.svg" alt="Viva Mais">
          <div>
            <p class="eyebrow" id="kicker">[Tema do vídeo]</p>
            <h1 class="title" id="title">[Mensagem <em>principal</em>]</h1>
            <p class="copy" id="copy">[Apoio claro para a mensagem.]</p>
            <div class="spark" id="spark"></div>
          </div>
        </main>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });
      timeline
        .fromTo("#brand-logo", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0.16)
        .fromTo("#kicker", { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, 0.36)
        .fromTo("#title", { opacity: 0, x: 72 }, { opacity: 1, x: 0, duration: 0.58, ease: "power4.out" }, 0.46)
        .fromTo("#copy", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.76)
        .fromTo("#spark", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.96);
      window.__timelines["__COMPOSITION_ID__"] = timeline;
    </script>
  </body>
</html>
