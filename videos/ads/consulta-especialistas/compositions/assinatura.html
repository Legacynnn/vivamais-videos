        (function () {
          const root = document.querySelector('[data-composition-id="assinatura"]');
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const m = VMMotion.create({ root, tl });
            const q = (s) => root.querySelector(s);
            const S = 0.38, BIG = 0.67;
            const P1 = q("#as-p1");
            gsap.set(P1, { left: 540 - 310, top: 895 - 438, scale: BIG, opacity: 0, y: 900 - 895 });
            const cards = Array.from(root.querySelectorAll(".as-card"));
            const dots = Array.from(root.querySelectorAll(".as-dots i"));
            const prox = { p: 0 };
            const upd = () => {
              cards.forEach((r, i) => {
                const d = i - prox.p, a = Math.abs(d), c = Math.min(a, 1), sg = d < 0 ? -1 : 1;
                gsap.set(r, { x: sg * (c * 350 + Math.max(0, a - 1) * 250), scale: 1 - 0.18 * c - Math.max(0, a - 1) * 0.1, rotateY: -sg * 26 * c, zIndex: 100 - Math.round(a * 10), opacity: a <= 1 ? 1 - 0.4 * a : Math.max(0, 0.6 - (a - 1) * 0.6), filter: "blur(" + (3 * c).toFixed(2) + "px)" });
              });
              dots.forEach((dt, i) => {
                const w = Math.max(0, 1 - Math.abs(i - prox.p));
                gsap.set(dt, { width: 16 + 28 * w, opacity: 0.3 + 0.7 * w });
              });
            };
            upd();
            tl.fromTo(q("#as-hub"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 0);
            m.rise("#as-line", 0.05, { stagger: 0.05 });
            tl.to(P1, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0);
            tl.to(q("#as-start"), { opacity: 0, duration: 0.1 }, 0.15);
            const pen = q(".as-pen");
            tl.set(pen, { opacity: 0 }, 0);
            tl.set(pen, { opacity: 1 }, 0.2);
            tl.to(q(".as-stroke"), { strokeDashoffset: 0, duration: 0.32, ease: "power1.inOut" }, 0.22);
            tl.fromTo(pen, { x: 10, y: 50 }, { x: 285, y: 15, duration: 0.32, ease: "power1.inOut" }, 0.22);
            tl.to(pen, { opacity: 0, duration: 0.08 }, 0.52);
            tl.fromTo(q("#as-tag"), { opacity: 0, scale: 0.5, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.25, ease: "back.out(1.4)", transformOrigin: "50% 50%" }, 0.4);
            tl.to(q("#as-tag"), { opacity: 0, duration: 0.15, ease: "power3.in" }, 0.68);
            tl.to(P1, { y: 790 - 895, scale: 0.2, opacity: 0, duration: 0.3, ease: "power3.in" }, 0.6);
            tl.to(q("#as-hub"), { opacity: 0, y: -18, duration: 0.2, ease: "power2.in" }, 0.55);
            tl.fromTo(q("#as-app"), { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power4.out" }, 0.62);
            tl.fromTo(q("#as-dots"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.75);
            const durs = [0.2, 0.2, 0.22, 0.22, 0.24, 0.34];
            let t = 0.85;
            durs.forEach((d, i) => {
              const last = i === durs.length - 1;
              tl.to(prox, { p: i + 1, duration: d, ease: last ? "power3.out" : "power2.inOut", onUpdate: upd }, t);
              t += d;
            });
            tl.to(q(".ce-graph"), { x: -1100, filter: "blur(14px)", duration: 0.5, ease: "power3.in" }, 2.72);
            window.__timelines["assinatura"] = tl;
          });
