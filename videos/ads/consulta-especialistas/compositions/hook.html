<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand/tokens.css">
      <link rel="stylesheet" href="assets/ce.css">
      <style>
        @font-face { font-family: "Space Grotesk"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/SpaceGrotesk-Medium.ttf") format("truetype"); }
        @font-face { font-family: "Space Grotesk"; font-weight: 700; font-display: block; src: url("assets/brand/fonts/SpaceGrotesk-Bold.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/DMSans-Medium.ttf") format("truetype"); }
        #hook .hk-head { top: 310px; left: 80px; right: 80px; text-align: center; font-size: 46px; line-height: 1.1; color: var(--ce-ink); letter-spacing: -0.035em; will-change: transform, filter, opacity; }
        #hook .hk-panel {
          position: absolute; left: 80px; top: 392px; width: 920px; height: 290px; border-radius: 56px; overflow: hidden;
          --m0: #12082f; --m1: #5a1fd1; --m2: #1c0d4f; --m3: #7e3bed; --m4: #14305f; --m5: #3b14a0;
          will-change: transform, filter, opacity;
        }
        #hook .hk-mesh { position: absolute; inset: 0; }
        #hook .hk-mesh i { position: absolute; display: block; width: 640px; height: 640px; border-radius: 50%; will-change: transform; }
        #hook .hk-mesh .b1 { left: -240px; top: -330px; background: radial-gradient(circle, var(--m1) 0%, transparent 68%); }
        #hook .hk-mesh .b2 { left: 380px; top: -360px; background: radial-gradient(circle, var(--m3) 0%, transparent 66%); }
        #hook .hk-mesh .b3 { left: 140px; top: -200px; background: radial-gradient(circle, var(--m2) 0%, transparent 70%); }
        #hook .hk-mesh .b4 { left: 560px; top: -170px; background: radial-gradient(circle, var(--m4) 0%, transparent 68%); }
        #hook .hk-mesh .b5 { left: -120px; top: -90px; background: radial-gradient(circle, var(--m5) 0%, transparent 68%); }
        #hook .hk-mesh .b6 { left: 260px; top: -60px; background: radial-gradient(circle, var(--m1) 0%, transparent 64%); }
        #hook .hk-grain { position: absolute; inset: 0; opacity: 0.08; pointer-events: none; }
        #hook .hk-ptext {
          position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; text-align: center;
          font: 700 88px/1.04 var(--vm-font-display, "Space Grotesk"), sans-serif; letter-spacing: -0.04em;
          color: var(--ce-ink);
        }
        #hook .hk-grad { background: linear-gradient(100deg, #5A1CC2 0%, #7230E2 30%, #8B45F3 42%, #B48CFF 50%, #8B45F3 58%, #7230E2 70%, #5A1CC2 100%) 100% 0% / 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; padding-bottom: 0.08em; }
        #hook .hk-rows { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
        #hook .hk-row { position: absolute; left: 0; width: 1080px; height: 116px; will-change: filter, opacity; }
        #hook .hk-strip { position: absolute; left: 0; top: 0; display: flex; align-items: center; width: max-content; will-change: transform; }
        #hook .hk-slot { position: relative; flex: none; margin-right: 24px; height: 116px; }
        #hook .hk-slot .ce-pill { position: relative; }
        #hook .hk-count { position: absolute; left: 80px; right: 80px; top: 1104px; height: 164px; display: flex; align-items: center; justify-content: center; gap: 26px; will-change: transform, filter, opacity; }
        #hook .hk-num { display: flex; align-items: center; height: 164px; font: 700 164px/164px var(--vm-font-display, "Space Grotesk"), sans-serif; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--ce-accent); }
        #hook .hk-plus { display: block; width: 92px; text-align: center; will-change: transform, opacity; }
        #hook .hk-dig { position: relative; display: block; width: 100px; height: 164px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%); }
        #hook .hk-dig b { display: block; font-weight: 700; height: 164px; line-height: 164px; text-align: center; }
        #hook .hk-col { display: block; will-change: transform, filter; }
        #hook .hk-lab { display: block; font: 500 56px/1 var(--vm-font-text, "DM Sans"), sans-serif; color: var(--ce-ink); white-space: nowrap; padding-top: 72px; will-change: transform, opacity; }
      </style>
      <div id="hook" class="vm-scene ce-scene" data-composition-id="hook" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
        <div class="ce-stage"><div class="ce-halo"></div></div>
        <img class="ce-logo" id="hk-logo" src="assets/brand/lockup-cor.svg" alt="Viva Mais">
        <h1 class="ce-line ce-line--center hk-head" id="hk-head">Consulte agora</h1>
        <div class="hk-panel" id="hk-panel">
          <p class="hk-ptext"><span>Todos os médicos<br><span class="hk-grad">no seu celular!</span></span></p>
        </div>
        <div class="hk-rows">
          <div class="hk-row" id="hk-rowA" style="top: 712px" data-layout-allow-overflow><div class="hk-strip" id="hk-stripA" data-layout-allow-overflow></div></div>
          <div class="hk-row" id="hk-rowB" style="top: 842px" data-layout-allow-overflow><div class="hk-strip" id="hk-stripB" data-layout-allow-overflow></div></div>
        </div>
        <div class="hk-count" id="hk-count"><span class="hk-num" id="hk-num"><span class="hk-plus" id="hk-plus">+</span><span class="hk-dig"><span class="hk-col" id="hk-tens"></span></span><span class="hk-dig"><span class="hk-col" id="hk-units"></span></span></span><span class="hk-lab" id="hk-lab">especialidades</span></div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const L = [["medico", "Clínica geral"], ["derma", "Dermatologia"], ["pediatria", "Pediatria"], ["ginecologia", "Ginecologia"], ["ortopedia", "Ortopedia"], ["neurologia", "Neurologia"], ["psicologia", "Psicologia"], ["endocrino", "Endocrinologia"], ["nutrologista", "Nutrologia"], ["urologista", "Urologia"], ["geriatra", "Geriatria"], ["cardio", "Cardiologia"], ["alergia", "Alergologia"], ["fonoaudiologa", "Fonoaudiologia"]];
          const SA = L.slice(0, 7);
          const SB = L.slice(7);
          function rep(l, n) { let o = []; for (let i = 0; i < n; i++) o = o.concat(l); return o; }
          function build(strip, list) {
            list.forEach(function (it) {
              const s = document.createElement("div");
              s.className = "hk-slot";
              s.setAttribute("data-layout-allow-overflow", "");
              s.innerHTML = '<div class="ce-pill"><img src="assets/icons/specialties/' + it[0] + '.png" alt="">' + it[1] + "</div>";
              strip.appendChild(s);
            });
          }
          const stripA = document.getElementById("hk-stripA");
          const stripB = document.getElementById("hk-stripB");
          build(stripA, rep(SA, 4));
          build(stripB, rep(SB, 5));

          document.fonts.ready.then(function () {
            const tl = gsap.timeline({ paused: true });
            const EX = 3.8, T = 0.7, V1B = 420, V2B = 6700, V1A = 420, V2A = 6700, BASE = 0.9;
            function rem(t, v1, v2) {
              const tau = Math.max(0, t - EX);
              const tail = v1 * (T - tau) + (v2 - v1) * (T * T * T - tau * tau * tau) / (3 * T * T);
              return t < EX ? tail + v1 * (EX - t) : tail;
            }
            const slotsA = [...stripA.children].map(function (s) { return { left: s.offsetLeft, w: s.offsetWidth, pill: s.firstChild }; });
            const slotsB = [...stripB.children].map(function (s) { return { left: s.offsetLeft, w: s.offsetWidth, pill: s.firstChild }; });
            const target = slotsB[SB.length * 3];
            const XB5 = 964 - (target.left + target.w / 2);
            const XA5 = -200 - rem(0, V1A, V2A);
            const state = { t: 0 };
            function lerp(a, b, k) { return a + (b - a) * k; }

            function apply() {
              const t = state.t;
              const wt = Math.min(Math.max((t - EX) / T, 0), 1);
              const xa = XA5 + rem(t, V1A, V2A);
              const xb = XB5 + rem(t, V1B, V2B);
              gsap.set(stripA, { x: xa });
              gsap.set(stripB, { x: xb });
              slotsA.forEach(function (m) {
                const cx = xa + m.left + m.w / 2;
                if (cx < -420 || cx > 1500) return;
                gsap.set(m.pill, { scale: BASE, transformOrigin: "50% 50%" });
              });
              slotsB.forEach(function (m) {
                const cx = xb + m.left + m.w / 2;
                if (cx < -420 || cx > 1500) return;
                const d = Math.min(Math.abs(cx - 540) / 700, 1);
                gsap.set(m.pill, { scale: lerp(BASE, 0.84 + 0.16 * (1 - d), wt), opacity: lerp(1, 1 - 0.38 * d, wt), transformOrigin: "50% 50%" });
              });
            }
            apply();
            tl.to(state, { t: 4.5, duration: 4.5, ease: "none", onUpdate: apply, immediateRender: false }, 0);

            gsap.set(["#hk-rowA", "#hk-rowB"], { opacity: 0, filter: "blur(1.5px)" });
            tl.fromTo(["#hk-rowA", "#hk-rowB"], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.05, immediateRender: false }, 0);
            tl.to("#hk-rowA", { opacity: 0, filter: "blur(3px)", duration: 0.6, ease: "power2.in" }, EX);
            tl.to("#hk-rowB", { filter: "blur(3px)", duration: 0.7, ease: "none" }, EX);

            gsap.set("#hk-logo", { opacity: 0 });
            tl.to("#hk-logo", { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);
            tl.fromTo("#hk-head", { opacity: 0, y: 28, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out", immediateRender: false }, 0);

            gsap.set("#hk-panel", { opacity: 0, scale: 0.94, filter: "blur(4px)", transformOrigin: "50% 50%" });
            tl.to("#hk-panel", { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.04);
            tl.to("#hk-panel", { scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.4)" }, 0.04);

            const drift = [[-150, 40], [-190, 60], [-120, -30], [-170, 30], [-130, -40], [-200, 20]];
            [...document.querySelectorAll("#hk-mesh i")].forEach(function (b, i) {
              tl.fromTo(b, { x: 0, y: 0 }, { x: drift[i][0], y: drift[i][1], duration: 4.5, ease: "none", immediateRender: false }, 0);
            });

            gsap.set("#hk-count", { opacity: 0, y: 24, filter: "blur(4px)" });
            tl.to("#hk-count", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, 0.08);
            function bez(x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                let t = x;
                for (let i = 0; i < 10; i++) {
                  const u = 1 - t;
                  const cx = 3 * x1 * t * u * u + 3 * x2 * t * t * u + t * t * t;
                  const d = 3 * x1 * u * u + 6 * (x2 - x1) * u * t + 3 * (1 - x2) * t * t;
                  if (Math.abs(cx - x) < 1e-6 || d < 1e-6) break;
                  t = Math.min(1, Math.max(0, t - (cx - x) / d));
                }
                const u = 1 - t;
                return 3 * y1 * t * u * u + 3 * y2 * t * t * u + t * t * t;
              };
            }
            const easeOut = bez(0.23, 1, 0.32, 1);
            const CELL = 164;
            const tens = document.getElementById("hk-tens");
            const units = document.getElementById("hk-units");
            for (let i = 0; i <= 4; i++) tens.innerHTML += "<b>" + i + "</b>";
            for (let i = 0; i <= 20; i++) units.innerHTML += "<b>" + (i % 10) + "</b>";
            gsap.set([tens, units], { y: 0, filter: "blur(0px)" });
            tl.to(tens, { y: -4 * CELL, duration: 1.15, ease: easeOut, immediateRender: false }, 0.4);
            tl.to(units, { y: -20 * CELL, duration: 1.55, ease: easeOut, immediateRender: false }, 0.4);
            tl.fromTo(tens, { filter: "blur(1.8px)" }, { filter: "blur(0px)", duration: 0.9, ease: "power2.out", immediateRender: false }, 0.4);
            tl.fromTo(units, { filter: "blur(2px)" }, { filter: "blur(0px)", duration: 1.2, ease: "power2.out", immediateRender: false }, 0.4);
            gsap.set("#hk-plus", { opacity: 0, scale: 0.8, transformOrigin: "50% 55%" });
            tl.to("#hk-plus", { opacity: 1, scale: 1, duration: 0.35, ease: easeOut }, 1.5);
            gsap.set("#hk-lab", { opacity: 0, y: 22 });
            tl.to("#hk-lab", { opacity: 1, y: 0, duration: 0.5, ease: easeOut }, 1.85);

            tl.to(["#hk-head", "#hk-panel", "#hk-count"], { y: -44, opacity: 0, filter: "blur(4px)", duration: 0.45, ease: "power3.in", stagger: 0.05 }, EX);
            tl.to("#hk-logo", { x: -120, opacity: 0, duration: 0.4, ease: "power3.in" }, EX);

            tl.fromTo(".hk-grad", { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 1.6, ease: "power2.inOut", immediateRender: false }, 0.5);
            window.__timelines["hook"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
