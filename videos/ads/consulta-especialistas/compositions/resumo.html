/div><div class="rn-view" style="transform: scale(0.9);"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A29FB0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></div></div></div></div><div class="rn-view" style="position: absolute; left: -10px; top: -10px; opacity: 0;"></div></div></div></div></div></div></div></div><!-- /screen --></div>

        </div>
        <div class="ce-tap-ring" id="rs-ring" style="opacity:0" data-layout-allow-overlap data-layout-allow-occlusion></div>
        <div class="ce-tap" id="rs-tap" style="opacity:0" data-layout-allow-overlap data-layout-allow-occlusion></div>
      </div>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const root = document.querySelector('[data-composition-id="resumo"]');
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const q = (s) => root.querySelector(s);
            const qa = (s) => Array.from(root.querySelectorAll(s));
            const O = "power4.out";
            const cam = q("#rs-cam"), mesh = q("#rs-mesh");
            const words = qa(".ce-line .ce-word");

            root.querySelectorAll("#rs-scr *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-overflow", ""); });

            const leaf = (t) => qa("#rs-scr div").find((n) => n.children.length === 0 && n.textContent.trim() === t);
            const userBlock = leaf("Resume minha consulta de hoje").parentElement.parentElement;
            const aiBox = leaf("Super Inteligência").parentElement.parentElement;
            const aiHead = aiBox.children[0], aiBody = aiBox.children[1], aiSrc = aiBox.children[2], aiAct = aiBox.children[3];
            const seg1 = aiBody.children[0], seg2 = aiBody.children[1];
            const chips = Array.from(aiSrc.children[1].children);
            const proChip = root.querySelector('[aria-label="Abrir fonte: Prontuário"]');

            const rr = root.getBoundingClientRect();
            const S = rr.width / 1080;
            const at = (el) => {
              const r = el.getBoundingClientRect();
              return { x: (r.left + r.width / 2 - rr.left) / S, y: (r.top + r.height / 2 - rr.top) / S };
            };
            const camR = cam.getBoundingClientRect();
            const c = at(proChip);
            const ox = c.x - (camR.left - rr.left) / S, oy = c.y - (camR.top - rr.top) / S;
            gsap.set(cam, { transformOrigin: ox + "px " + oy + "px" });

            const drift = [[-150, 60], [-190, 90], [-120, -50], [-170, 40], [-130, -60], [-200, 30]];
            qa(".rs-mesh i").forEach((b, i) => tl.fromTo(b, { x: 0, y: 0 }, { x: drift[i][0], y: drift[i][1], duration: 4, ease: "none" }, 0));

            tl.fromTo(mesh, { x: 1080 }, { x: 0, duration: 0.7, ease: O }, 0);
            tl.fromTo(words, { x: 140, opacity: 0, filter: "blur(4px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: O, stagger: 0.08 }, 0.25);
            tl.fromTo(cam, { x: 900, y: 140, opacity: 0, filter: "blur(4px)" }, { x: 0, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: O }, 0.05);

            tl.fromTo(userBlock, { y: 28, scale: 0.94, opacity: 0, transformOrigin: "100% 100%" }, { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: O, immediateRender: true }, 0.65);
            tl.fromTo(aiHead, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: O }, 1.05);
            tl.fromTo(seg1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: O }, 1.15);
            tl.fromTo(seg2, { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 1.0, ease: "steps(5)" }, 1.3);
            tl.set(seg2, { clipPath: "none" }, 2.31);
            tl.fromTo(aiSrc.children[0], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 2.3);
            chips.forEach((ch, i) => tl.fromTo(ch, { opacity: 0, scale: 0.8, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 2.35 + i * 0.1));
            tl.fromTo(aiAct, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 2.75);

            const tp = { x: c.x, y: c.y };
            const tPress = 3.3, glide = 0.4;
            tl.fromTo("#rs-tap", { x: tp.x + 110, y: tp.y + 150, opacity: 0, scale: 1 }, { x: tp.x, y: tp.y, opacity: 1, duration: glide, ease: "power3.inOut", immediateRender: false }, tPress - glide);
            tl.fromTo("#rs-ring", { x: tp.x, y: tp.y, opacity: 0, scale: 1 }, { opacity: 0.9, duration: 0.01, immediateRender: false }, tPress);
            tl.to("#rs-ring", { scale: 1.8, opacity: 0, duration: 0.4, ease: "power2.out" }, tPress + 0.01);
            tl.to("#rs-tap", { scale: 0.86, duration: 0.1, ease: "power2.out" }, tPress);
            tl.to("#rs-tap", { scale: 1, duration: 0.12, ease: "power2.out" }, tPress + 0.1);
            tl.to("#rs-tap", { opacity: 0, duration: 0.15, ease: "power2.in" }, tPress + 0.18);
            tl.to(proChip, { scale: 0.94, duration: 0.1, ease: "power2.out" }, tPress);
            tl.to(proChip, { scale: 1, duration: 0.15, ease: "power2.out" }, tPress + 0.12);

            const T = 3.45;
            tl.to(words, { x: -120, opacity: 0, filter: "blur(4px)", duration: 0.3, ease: "power3.in", stagger: 0.03 }, T);
            tl.to(mesh, { opacity: 0, duration: 0.35, ease: "power2.in" }, T);
            tl.to(cam, { scale: 5.6, x: 540 - c.x, y: 830 - c.y, filter: "blur(14px)", duration: 0.5, ease: "power3.in" }, T);

            window.__timelines["resumo"] = tl;
          });
        })();
      </script>
    </template>
  </body>
