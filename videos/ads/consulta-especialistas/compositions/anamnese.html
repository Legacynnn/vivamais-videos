          <div class="sx-card" id="sx-card" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow>

            <div class="sx-r" id="sx-c0" data-layout-allow-overlap data-layout-allow-occlusion><span class="sx-i"><svg viewBox="0 0 24 24"><path d="M3 9h10a3 3 0 1 0-3-3"/><path class="a" d="M3 15h14a3 3 0 1 1-3 3"/><path d="M3 12h6"/></svg></span><span class="sx-n">Falta de ar</span><span class="sx-b"><svg viewBox="0 0 24 24"><path d="M5.500 12.500l4.500 4.500 8.500-9.500"/></svg></span></div>
            <div class="sx-r" id="sx-c1" data-layout-allow-overlap data-layout-allow-occlusion><span class="sx-i"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="15" height="8" rx="2.500"/><path d="M21 11v2"/><path class="a" d="M6 12h3"/></svg></span><span class="sx-n">Cansaço</span><span class="sx-b"><svg viewBox="0 0 24 24"><path d="M5.500 12.500l4.500 4.500 8.500-9.500"/></svg></span></div>
            <div class="sx-r" id="sx-c2" data-layout-allow-overlap data-layout-allow-occlusion><span class="sx-i"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/></svg></span><span class="sx-n">Palpitação</span><span class="sx-b"><svg viewBox="0 0 24 24"><path d="M5.500 12.500l4.500 4.500 8.500-9.500"/></svg></span></div>

          <div class="an-sy" id="an-s1" style="left: 560px" data-layout-allow-overlap data-layout-allow-occlusion><span class="sx-i"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="15" height="8" rx="2.500"/><path d="M21 11v2"/><path class="a" d="M6 12h3"/></svg></span><span>Cansaço</span></div>

          <div class="an-file" id="an-f1" data-layout-allow-overlap data-layout-allow-occlusion style="left: 405px"><div class="an-th"><svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l3.500-4.500"/><path class="a" d="M4 19.500h16"/></svg><span class="an-tag">IMG</span></div><div class="an-fn" data-layout-allow-overlap>Medição de pressão</div><div class="an-fs" data-layout-allow-overlap>Foto do aparelho</div></div>
          <div class="an-file" id="an-f2" data-layout-allow-overlap data-layout-allow-occlusion style="left: 690px"><div class="an-th"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path class="a" d="M12 11.500c-1.500 1.800-2.500 2.800-2.500 4a2.500 2.500 0 0 0 5 0c0-1.200-1-2.200-2.500-4z"/></svg><span class="an-tag">PDF</span></div><div class="an-fn" data-layout-allow-overlap>Hemograma.pdf</div><div class="an-fs" data-layout-allow-overlap>Exame de sangue</div></div>

          <div class="an-ok"><span class="an-okp" id="an-okp"><b><svg viewBox="0 0 24 24"><path d="M5.500 12.500l4.500 4.500 8.500-9.500"/></svg></b>Já recebeu tudo</span></div>

      <script>
        (function () {
          const root = document.getElementById("anamnese");
          window.__timelines = window.__timelines || {};
          document.fonts.ready.then(function () {
            const tl = gsap.timeline({ paused: true });
            const probe = function (v) {
              const p = document.createElement("div");
              p.style.backgroundColor = "var(" + v + ")";
              root.appendChild(p);
              const c = getComputedStyle(p).backgroundColor;
              p.remove();
              return c;
            };
            const ACC = probe("--ce-accent");
            const SOFT = probe("--ce-accent-soft");
            const files = ["#an-f0", "#an-f1", "#an-f2"];
            const symp = [].slice.call(root.querySelectorAll(".sx-r"));
            const pos = function (el, fx) {
              return { x: 80 + el.offsetLeft + el.offsetWidth * fx, y: 540 + el.offsetTop + el.offsetHeight * 0.5 };
            };

            gsap.set("#an-l2, #an-l3", { opacity: 0, y: 30, filter: "blur(4px)" });
            gsap.set(files, { opacity: 0, y: 120, rotation: 0, scale: 0.9, transformOrigin: "50% 50%" });
            gsap.set("#an-doc", { opacity: 0, y: 60, scale: 0.92, filter: "blur(4px)", transformOrigin: "50% 50%" });
            gsap.set("#an-okp", { opacity: 0, y: 30, scale: 0.85, filter: "blur(4px)" });
            gsap.set(symp, { opacity: 0, y: 24, filter: "blur(4px)", transformOrigin: "50% 50%" });
            gsap.set(".sx-b svg", { scale: 0.4, transformOrigin: "50% 50%" });
            gsap.set("#sx-title", { opacity: 0, y: 20, filter: "blur(4px)" });
            gsap.set("#sx-card", { transformOrigin: "50% 50%" });
            gsap.set("#an-s0, #an-s1", { opacity: 0, y: 50, scale: 0.9, filter: "blur(4px)", transformOrigin: "50% 50%" });
            gsap.set("#an-bd", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" });

            tl.fromTo("#an-ask", { x: 1150, filter: "blur(4px)" }, { x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0);
            tl.to("#sx-title", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, 0.15);
            symp.forEach(function (el, i) {
              tl.to(el, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, 0.25 + i * 0.05);
            });

            const pick = function (i, tp) {
              const el = symp[i];
              const p = pos(el, 0.88);
              if (i === 0) {
                tl.set("#sx-tap", { x: p.x + 160, y: p.y + 130, opacity: 0 }, 0);
                tl.set("#sx-ring", { x: p.x, y: p.y, opacity: 0 }, 0);
                tl.to("#sx-tap", { opacity: 1, duration: 0.15, ease: "power2.out" }, tp - 0.38);
              }
              tl.to("#sx-tap", { x: p.x, y: p.y, duration: 0.3, ease: "power3.inOut" }, tp - 0.3);
              tl.to("#sx-tap", { scale: 0.58, duration: 0.1, ease: "power2.out" }, tp);
              tl.to("#sx-tap", { scale: 0.7, duration: 0.2, ease: "power3.out" }, tp + 0.1);
              tl.fromTo("#sx-ring", { x: p.x, y: p.y, scale: 1, opacity: 0.8 }, { scale: 1.8, opacity: 0, duration: 0.4, ease: "power3.out" }, tp);
              tl.to(el, { scale: 0.97, duration: 0.1, ease: "power2.out" }, tp);
              tl.to(el, { scale: 1, duration: 0.3, ease: "back.out(2)" }, tp + 0.1);
              tl.to(el, { backgroundColor: SOFT, boxShadow: "inset 0 0 0 2px " + ACC, duration: 0.15, ease: "none" }, tp);
              tl.to(el.querySelector(".sx-b"), { backgroundColor: ACC, boxShadow: "inset 0 0 0 0px " + ACC, duration: 0.12, ease: "none" }, tp);
              tl.to(el.querySelector(".sx-b svg"), { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, tp);
            };
            pick(0, 0.8);
            pick(1, 1.05);
            tl.to("#sx-tap", { opacity: 0, duration: 0.2 }, 1.3);

            const T2 = 1.75;
            tl.to("#sx-card > *", { opacity: 0, filter: "blur(4px)", duration: 0.12, ease: "power2.in" }, T2 - 0.1);
            tl.to("#sx-card", { scale: 0.7, y: -60, opacity: 0, duration: 0.22, ease: "power2.in" }, T2 - 0.05);
            tl.to("#an-s0", { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, T2);
            tl.to("#an-s1", { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, T2 + 0.06);
            tl.to("#an-doc", { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, T2 + 0.05);

            tl.to("#an-l1", { opacity: 0, y: -26, filter: "blur(4px)", duration: 0.18, ease: "power2.in" }, T2 - 0.25);
            tl.to("#an-l2", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, T2 - 0.03);

            const FR = [-8, 0, 8];
            const FY = [0, -20, 0];
            files.forEach(function (f, i) {
              tl.to(f, { opacity: 1, y: FY[i], rotation: FR[i], scale: 1, duration: 0.55, ease: "expo.out" }, T2 + 0.12 + i * 0.1);
            });

            const T3 = 2.7;
            tl.to("#an-l2", { opacity: 0, y: -26, filter: "blur(4px)", duration: 0.18, ease: "power2.in" }, 2.92);
            tl.to("#an-l3", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 3.12);

            const DCX = 540, DCY = 1055, FD = 0.38, GAP = 0.14;
            const items = [
              { sel: "#an-s0", cx: 300, cy: 588 },
              { sel: "#an-s1", cx: 780, cy: 588 },
              { sel: "#an-f0", cx: 255, cy: 796 },
              { sel: "#an-f1", cx: 540, cy: 796 },
              { sel: "#an-f2", cx: 825, cy: 796 }
            ];
            items.forEach(function (it, i) {
              const t = T3 + 0.05 + i * GAP;
              tl.to(it.sel, { x: DCX - it.cx, y: DCY - it.cy, scale: 0.3, rotation: 0, opacity: 0, duration: FD, ease: "power3.in" }, t);
              const tl_ = t + FD;
              tl.to("#an-doc", { scale: 1.035, duration: 0.07, ease: "sine.out" }, tl_);
              tl.to("#an-doc", { scale: 1, duration: 0.12, ease: "sine.in" }, tl_ + 0.07);
              if (i === 0) tl.to("#an-bd", { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, tl_);
              else tl.fromTo("#an-bd", { scale: 1.25 }, { scale: 1, duration: 0.18, ease: "power3.out" }, tl_);
              if (i > 0) tl.set("#an-n" + i, { opacity: 0 }, tl_);
              tl.set("#an-n" + (i + 1), { opacity: 1 }, tl_);
            });
            tl.to("#an-okp", { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, 3.6);

            tl.to("#an-ask", { x: -1150, opacity: 0, filter: "blur(4px)", duration: 0.35, ease: "power3.in" }, 4.15);
            tl.fromTo("#an-halo", { scale: 1 }, { scale: 1.06, duration: 4.5, ease: "none" }, 0);

            window.__timelines["anamnese"] = tl;
          });
        })();
      </script>
    </template>
