            $$("#hz-profile *, #hz-done *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); });
            k.screens(["hz-profile", "hz-done"]);

            const chip = k.center("#hz-slot1430");
            const go = k.center("#hz-go");
            const badge = k.center("#hz-badge");
            const offset = Math.round(chip.y - 470);
            gsap.set("#hz-scroll", { y: -offset });
            gsap.set("#hz-pinbar", { opacity: 1 });
            gsap.set("#hz-bar", { opacity: 1, y: 0 });
            gsap.set("#hz-slot1430 .hz-on, #hz-slot1430 .hz-ton", { opacity: 1 });
            gsap.set("#hz-line", { opacity: 1 });

            const cam = $(".cam");
            const goBtn = $("#hz-go");

            k.tap(go.x, go.y, 0.3, null);
            tl.to(goBtn, { scale: 0.96, duration: 0.1, ease: "power2.in" }, 0.3);
            tl.to(goBtn, { scale: 1, duration: 0.15, ease: "power2.out" }, 0.4);
            tl.to("#hz-golbl", { opacity: 0, duration: 0.1, ease: "power2.out" }, 0.4);
            tl.to("#hz-spin", { opacity: 1, duration: 0.1, ease: "power2.out" }, 0.4);
            tl.to("#hz-spin", { rotation: 540, duration: 0.4, ease: "none" }, 0.4);

            tl.to("#hz-line", { x: -140, opacity: 0, filter: "blur(4px)", duration: 0.35, ease: "power3.in" }, 0.55);
            k.push("hz-profile", "hz-done", 0.8);

            tl.set("#hz-line2", { opacity: 1 }, 0.95);
            tl.fromTo($$("#hz-line2 .ce-word"), { x: 140, opacity: 0, filter: "blur(16px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out", stagger: 0.08, immediateRender: true }, 0.95);

            tl.fromTo("#hz-badge", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)", immediateRender: true }, 0.95);
            tl.to("#hz-badge path", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.1);
            tl.fromTo("#hz-dn-t", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power4.out", immediateRender: true }, 1.1);
            tl.fromTo("#hz-dcard", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out", immediateRender: true }, 1.2);

            const rnd = (() => { let a = 20261116; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })();
            const o = sceneOf(badge.x, badge.y);
            const cf = $("#hz-cf");
            const cols = ["var(--vm-violet-500)", "var(--vm-violet-300)", "var(--vm-iris-300)", "var(--vm-iris-400)", "var(--vm-azure-300)", "var(--vm-violet-100)", "var(--vm-violet-500)"];
            const T0 = 1.05;
            for (let i = 0; i < 56; i++) {
                const e = document.createElement("i");
                e.setAttribute("data-layout-allow-overflow", "");
                e.setAttribute("data-layout-allow-overlap", "");
                e.setAttribute("data-layout-allow-occlusion", "");
                const circle = rnd() < 0.35;
                const w = circle ? 14 + rnd() * 8 : 12 + rnd() * 16;
                const h = circle ? w : 7 + rnd() * 9;
                const col = cols[Math.floor(rnd() * cols.length)];
                e.style.cssText = `width:${w}px;height:${h}px;margin:${-h / 2}px 0 0 ${-w / 2}px;background:${col};border-radius:${circle ? "50%" : "3px"};` + (col.includes("violet-100") ? "box-shadow:0 0 0 1.5px var(--vm-violet-300);" : "");
                cf.appendChild(e);
                const ang = (-Math.PI * (0.05 + 0.9 * rnd())) + (rnd() < 0.2 ? Math.PI * 0.9 : 0);
                const r = 260 + rnd() * 520;
                const bx = Math.cos(ang) * r;
                const by = Math.sin(ang) * r * 0.9;
                const d1 = 0.45 + rnd() * 0.2;
                const fall = 900 + rnd() * 700;
                const drift = (rnd() - 0.5) * 220;
                const rot = (rnd() - 0.5) * 720;
                const t0 = T0 + rnd() * 0.08;
                gsap.set(e, { x: o.x, y: o.y, rotation: rnd() * 360, scale: 0.4 });
                tl.set(e, { opacity: 1 }, t0);
                tl.to(e, { x: o.x + bx, y: o.y + by, rotation: "+=" + rot, scale: 1, duration: d1, ease: "power3.out" }, t0);
                tl.to(e, { x: "+=" + drift, y: "+=" + fall, rotation: "+=" + rot, duration: 1.6, ease: "power2.in" }, t0 + d1);
                tl.to(e, { opacity: 0, duration: 0.5, ease: "power1.in" }, t0 + d1 + 1.1);
            }

            m.exit("#hz-line2", 2.7, { dir: "left" });
            tl.to("#hz-line2", { filter: "blur(4px)", duration: 0.4, ease: "power3.in" }, 2.7);
            tl.to(cam, { x: -1200, filter: "blur(4px)", duration: 0.5, ease: "power3.in" }, 2.75);

            window.__timelines["horario"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
