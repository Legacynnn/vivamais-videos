      </style>

            <div data-hf-id="hf-63ke" class="es-row" data-row="2" style="top: 650px" data-layout-allow-overflow=""><div data-hf-id="hf-xhsc" class="es-strip" data-layout-allow-overflow=""></div></div>

              <div data-hf-id="hf-yih3" class="es-row" data-row="4" style="top: 990px" data-layout-allow-overflow=""><div data-hf-id="hf-wp6a" class="es-strip" data-layout-allow-overflow=""></div></div>
              <div data-hf-id="hf-pifu" class="es-row" data-row="5" style="top: 1160px" data-layout-allow-overflow=""><div data-hf-id="hf-yopf" class="es-strip" data-layout-allow-overflow=""></div></div>
              <div data-hf-id="hf-hsx4" class="es-row" data-row="6" style="top: 1330px" data-layout-allow-overflow=""><div data-hf-id="hf-z30g" class="es-strip" data-layout-allow-overflow=""></div></div>
              <div data-hf-id="hf-6p62" class="es-row" data-row="7" style="top: 1500px" data-layout-allow-overflow=""><div data-hf-id="hf-xw3d" class="es-strip" data-layout-allow-overflow=""></div></div>
            </div>
          </div>
        </div>
        <h1 data-hf-id="hf-ufgt" class="mn-line mn-line--top es-l5">E especialistas de <em data-hf-id="hf-n5df">todo o Brasil.</em></h1>
        <div data-hf-id="hf-hx2j" class="es-stat">
          <p data-hf-id="hf-7378" class="es-num">0</p>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const ICON = { "Clínica geral": "medico", "Cardiologia": "cardio", "Dermatologia": "derma", "Pediatria": "pediatria", "Ginecologia": "ginecologia", "Ortopedia": "ortopedia", "Neurologia": "neurologia", "Psicologia": "psicologia", "Endocrinologia": "endocrino", "Nutrologia": "nutrologista", "Urologia": "urologista", "Geriatria": "geriatra", "Alergologia": "alergia", "Fonoaudiologia": "fonoaudiologa" };
          const R1 = ["Cardiologia", "Pediatria", "Dermatologia", "Psicologia", "Ortopedia", "Clínica geral", "Neurologia", "Ginecologia", "Endocrinologia", "Urologia", "Geriatria", "Nutrologia", "Alergologia", "Fonoaudiologia"];
          const R2 = ["Ginecologia", "Neurologia", "Clínica geral", "Urologia", "Cardiologia", "Geriatria", "Dermatologia", "Nutrologia", "Pediatria", "Alergologia", "Psicologia", "Fonoaudiologia", "Ortopedia", "Endocrinologia"];
          const R4 = ["Psicologia", "Endocrinologia", "Ortopedia", "Cardiologia", "Alergologia", "Pediatria", "Urologia", "Clínica geral", "Dermatologia", "Fonoaudiologia", "Ginecologia", "Geriatria", "Neurologia", "Nutrologia"];
          const R5 = ["Dermatologia", "Geriatria", "Nutrologia", "Clínica geral", "Neurologia", "Cardiologia", "Fonoaudiologia", "Psicologia", "Urologia", "Ortopedia", "Pediatria", "Endocrinologia", "Ginecologia", "Alergologia"];
          const DOCS = [["camila-rocha", "Dra. Camila Rocha", "Clínica geral"], ["rafael", "Dr. Rafael Martins", "Cardiologia"], ["mariana", "Dra. Mariana Lopes", "Dermatologia"], ["julia", "Dra. Júlia Prado", "Pediatria"]];
          function twice(l) { return l.concat(l); }
          const ROWS = {
            1: { list: twice(R1), v: 150, off: 0 },
            2: { list: twice(R2), v: 230, off: -220 },
            3: { docs: true, v: 180, off: -90 },
            4: { list: twice(R4), v: 260, off: -310 },
            5: { list: twice(R5), v: 160, off: -150 },
            6: { list: twice(R2.slice().reverse()), v: 220, off: -260 },
            7: { list: twice(R1.slice().reverse()), v: 190, off: -40 }
          };
          const root = document.getElementById("especialistas");
          Object.keys(ROWS).forEach(function (k) {
            const r = ROWS[k];
            const strip = root.querySelector('.es-row[data-row="' + k + '"] .es-strip');
            let html = "";
            if (r.docs) {
              for (let c = 0; c < 4; c++) DOCS.forEach(function (d) {
                html += '<div class="es-pill es-doc"><img src="assets/people/doctors/' + d[0] + '.jpg" alt="">' + d[1] + '<span>· ' + d[2] + '</span></div>';
              });
            } else {
              r.list.forEach(function (n) {
                html += '<div class="es-pill"><img src="assets/icons/specialties/' + ICON[n] + '.png" alt="">' + n + '</div>';
              });
            }
            strip.innerHTML = html;
            r.strip = strip;
          });

          document.fonts.ready.then(function () {
            const tl = gsap.timeline({ paused: true });
            const m = VMMotion.create({ root: root, tl: tl });
            const DUR = 5.5, START = 20.4;
            tl.fromTo(root.querySelector(".mn-aurora"), { x: -12 * START }, { x: -12 * (START + DUR), duration: DUR, ease: "none" }, 0);

            Object.keys(ROWS).forEach(function (k) {
              const r = ROWS[k];
              tl.fromTo(r.strip, { x: r.off }, { x: r.off - r.v * DUR, duration: DUR, ease: "none", immediateRender: false }, 0);
            });

            const rails = root.querySelector(".es-rails");
            gsap.set(rails, { x: 880 });
            tl.to(rails, { x: 0, duration: 0.9, ease: "power3.out" }, 0);
            tl.fromTo(rails, { clipPath: "inset(0 0% 0 0)" }, { clipPath: "inset(0 100% 0 0)", duration: 0.75, ease: "power2.in", immediateRender: false }, 4.55);
            tl.to(rails, { x: -400, duration: 0.75, ease: "power2.in" }, 4.55);

            m.rise(root.querySelector(".es-l5"), 0.35);
            m.exit(root.querySelector(".es-l5"), 4.55);

            tl.fromTo(root.querySelector(".es-low"), { y: 0 }, { y: 340, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 1.9);

            const plus = root.querySelector(".mn-plus");
            gsap.set(plus, { xPercent: -50, yPercent: -50, x: -364, y: 205, scale: 0.767, opacity: 0 });
            tl.fromTo(plus, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 0.767, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, 2.5);
            tl.to(plus, { x: 0, y: 0, scale: 1, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 4.85);

            const num = root.querySelector(".es-num");
            const word = root.querySelector(".es-word");
            gsap.set(num, { opacity: 0 });
            tl.fromTo(num, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 2.5);
            m.count(num, 2.55, 40, { dur: 0.75 });
            m.rise(word, 2.75);
            m.hold(root.querySelector(".es-stat"), 3.3, 1.25, { to: 1.03 });
            m.exit(num, 4.7);
            m.exit(word, 4.7);

            window.__timelines["especialistas"] = tl;
          });
        })();
      </script>
    </template>
