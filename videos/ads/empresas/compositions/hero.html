<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/brand/tokens.css">
      <link rel="stylesheet" href="assets/em.css">
      <style>
        @font-face { font-family: "Space Grotesk"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/SpaceGrotesk-Medium.ttf") format("truetype"); }
        @font-face { font-family: "Space Grotesk"; font-weight: 700; font-display: block; src: url("assets/brand/fonts/SpaceGrotesk-Bold.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 400; font-display: block; src: url("assets/brand/fonts/DMSans-Regular.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/DMSans-Medium.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 700; font-display: block; src: url("assets/brand/fonts/DMSans-Bold.ttf") format("truetype"); }
        #hero .em-line { top: 545px; font-size: 124px; line-height: 1.04; letter-spacing: -0.04em; }
        #hero .hm-l { display: block; white-space: nowrap; }
        #hero .hm-w { display: inline-block; will-change: transform, filter, opacity; }
        #hero .em-line em { display: inline; background: none; padding: 0; color: inherit; -webkit-text-fill-color: initial; }
        #hero .hm-g { display: inline-block; padding-bottom: 0.1em; color: transparent; -webkit-text-fill-color: transparent; -webkit-background-clip: text; background-clip: text; background-size: 250% 100%; background-position: 100% 0%; will-change: transform, filter, opacity, background-position; }
        #hero .em-sub { top: 960px; font-size: 60px; left: 80px; right: 80px; text-align: center; color: var(--vm-ink-600); will-change: transform, filter, opacity; }
        #hero .hm-layer { position: absolute; inset: 0; will-change: transform, filter, opacity; }
        #hero .hm-lb { z-index: 1; }
        #hero .hm-lm { z-index: 2; }
        #hero .hm-lf { z-index: 3; }
        #hero .em-line, #hero .em-sub { z-index: 10; }
        #hero .em-logo { opacity: 0; }
        #hero .hm-chip { background: var(--em-white); }
        #hero .hm-gh { visibility: hidden; }
        #hero .hm-n { position: relative; display: inline-block; font-variant-numeric: tabular-nums; }
        #hero .hm-cv { position: absolute; left: 0; top: 0; }
        #hero .hm-t { display: inline-flex; gap: 0.28em; white-space: nowrap; }
        #hero .hm-morph { position: absolute; z-index: 30; display: block; padding: 0; gap: 0; visibility: hidden; background: var(--em-white); overflow: hidden; }
        #hero .hm-in { position: absolute; left: 16px; top: 0; height: 132px; display: flex; align-items: center; gap: 26px; }
        #hero .hm-ring { position: absolute; left: 24px; top: 24px; width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 4px solid var(--em-hair); opacity: 0; }
        #hero .hm-t2 { position: absolute; left: 110px; top: 24px; height: 64px; display: flex; align-items: center; white-space: nowrap; opacity: 0; }
      </style>
      <div id="hero" class="vm-scene em-scene" data-composition-id="hero" data-start="0" data-duration="4" data-width="1080" data-height="1920">
        <div class="em-stage"></div>
        <div class="em-aurora" data-layout-allow-overflow><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
        <img class="em-logo" id="hm-logo" src="assets/brand/lockup-cor.svg" alt="Viva Mais">
        <div class="hm-layer hm-lb" id="hm-lb" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion></div>
        <div class="hm-layer hm-lm" id="hm-lm" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion></div>
        <div class="hm-layer hm-lf" id="hm-lf" data-layout-allow-overflow data-layout-allow-overlap data-layout-allow-occlusion></div>
        <h1 class="em-line em-line--center" id="hm-h">
          <span class="hm-l"><span class="hm-w">Saúde</span> <span class="hm-w">para</span></span>
          <span class="hm-l"><span class="hm-w">seu</span> <span class="hm-w">time</span></span>
          <span class="hm-l"><em id="hm-em"><span class="hm-g">Viver</span> <span class="hm-g">Mais</span></em></span>
        </h1>
        <p class="em-sub" id="hm-sub">Tudo em um aplicativo</p>
      </div>
      <script>
        (function () {
          const root = document.getElementById("hero");
          window.__timelines = window.__timelines || {};
          document.fonts.ready.then(function () {
            const tl = gsap.timeline({ paused: true });
            const $ = function (s) { return root.querySelector(s); };
            const D = 4.0, V = 70;

            const ICON = {
              brain: '<path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4"/><path d="M17.598 6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/>',
              clip: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
              pill: '<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
              mega: '<path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/>'
            };
            const svg = function (k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICON[k] + "</svg>"; };
            const img = function (s) { return '<img src="' + s + '" alt="">'; };
            const badge = function (h) { return '<span class="em-badge">' + h + "</span>"; };
            const STACK = '<span class="em-badge em-badge--stack hm-stack"><span>' + img("assets/icons/specialties/cardio.png") + "</span><span>" + img("assets/icons/specialties/derma.png") + "</span><span>" + img("assets/icons/specialties/pediatria.png") + "</span></span>";
            const LAB40 = '<span class="hm-t hm-t1"><span class="hm-n"><span class="hm-gh">+40</span><span class="hm-cv">+40</span></span><span>Especialidades</span></span>';

            const defs = {
              med: badge(img("assets/illustrations/plantao-24h.webp")) + "<span>Médico 24/7</span>",
              psi: badge(img("assets/icons/specialties/psicologia.png")) + "<span>Psicologia</span>",
              nut: badge(img("assets/icons/specialties/nutrologista.png")) + "<span>Nutrição</span>",
              men: badge(svg("brain")) + "<span>Saúde mental</span>",
              esp: STACK + LAB40,
              nr1: badge(svg("clip")) + "<span>NR-1 psicossocial</span>",
              far: badge(svg("pill")) + "<span>Farmácias com desconto</span>",
              den: badge(svg("mega")) + "<span>Canal de denúncia</span>"
            };
            const mk = function (k) {
              const c = document.createElement("div");
              c.className = "em-chip hm-chip";
              c.innerHTML = defs[k];
              return c;
            };

            const LAY = {
              b: { el: $("#hm-lb"), s: 0.7, blur: 2.5, op: 0.55, v: -28 },
              m: { el: $("#hm-lm"), s: 0.85, blur: 0, op: 1, v: 55 },
              f: { el: $("#hm-lf"), s: 1, blur: 0, op: 1, v: -90 }
            };
            const F = [
              { k: "men", l: "b", x: 680, y: 330, r: 3 },
              { k: "nut", l: "b", x: -60, y: 1160, r: -3 },
              { k: "psi", l: "b", x: 200, y: 1330, r: 2 },
              { k: "den", l: "b", x: 560, y: 1290, r: -2 },
              { k: "nr1", l: "m", x: -200, y: 290, r: -3 },
              { k: "med", l: "f", x: 700, y: 420, r: 2 },
              { k: "esp", l: "f", x: 120 + 90 * 3.6, y: 1060, r: 0 }
            ];
            let esp = null;
            F.forEach(function (o, i) {
              const L = LAY[o.l];
              const c = mk(o.k);
              c.style.left = (o.k === "far" ? 120 + 90 * 3.6 + 1000 : o.x) + "px";
              c.style.top = o.y + "px";
              L.el.appendChild(c);
              o.c = c;
              if (o.k === "esp") esp = c;
              gsap.set(c, { opacity: 0, scale: L.s * 0.8, y: 24, rotation: o.r, filter: "blur(4px)", transformOrigin: "50% 50%" });
              tl.fromTo(c, { x: 0 }, { x: L.v * D, duration: D, ease: "none" }, 0);
              const t = 0.5 + i * 0.06;
              tl.set(c, { opacity: L.op }, t);
              tl.to(c, { scale: L.s, y: 0, filter: "blur(" + L.blur + "px)", duration: 0.5, ease: "expo.out" }, t);
            });
            const ew = esp.offsetWidth;
            F.forEach(function (o) { if (o.k === "far") o.c.style.left = (120 + 90 * 3.6 + ew + 28) + "px"; });

            const aur = root.querySelectorAll(".em-aurora i");
            tl.fromTo(aur, { x: 0, y: 0 }, { x: -7 * D, y: -3 * D, duration: D, ease: "none" }, 0);

            const outE = gsap.parseEase("power4.out");
            const rise = function (el, d, dur, dist) {
              const p = Math.max(0, Math.min(1, -d / dur));
              const e0 = outE(p);
              const rem = 1 - e0;
              const t0 = Math.max(0, d);
              gsap.set(el, { opacity: Math.min(1, e0 * 1.6), y: dist * (1 - e0), filter: "blur(" + (4 * (1 - e0)).toFixed(2) + "px)" });
              tl.to(el, {
                y: 0, filter: "blur(0px)", duration: dur * (1 - p),
                ease: function (u) { return rem > 0 ? (outE(p + u * (1 - p)) - e0) / rem : 1; }
              }, t0);
              tl.to(el, { opacity: 1, duration: Math.max(0.01, 0.3 * (1 - p)), ease: "none" }, t0);
            };
            const units = [].slice.call(root.querySelectorAll("#hm-h .hm-w, #hm-h .hm-g"));
            units.forEach(function (u, i) { rise(u, -0.15 + i * 0.05, 0.85, 60); });
            const grad = "linear-gradient(100deg, #5A1CC2 0%, #9531FF 22%, #38C8E6 40%, #9531FF 58%, #5A1CC2 76%, #9531FF 88%, #38C8E6 100%)";
            const gEls = root.querySelectorAll(".hm-g");
            gsap.set(gEls, { backgroundImage: grad });
            tl.fromTo(gEls, { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: D, ease: "none", immediateRender: true }, 0);

            gsap.set("#hm-sub", { opacity: 0, y: 34, filter: "blur(4px)" });
            tl.set("#hm-sub", { opacity: 1 }, 0.5);
            tl.to("#hm-sub", { y: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, 0.5);
            tl.to("#hm-logo", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.6);

            const cv = esp.querySelector(".hm-cv");
            const s = { v: 0 };
            cv.textContent = "+0";
            tl.fromTo(s, { v: 0 }, { v: 40, duration: 1.1, ease: "power3.out", onUpdate: function () { cv.textContent = "+" + Math.round(s.v); } }, 1.0);

            const mo = document.createElement("div");
            mo.className = "em-chip hm-morph em-morph";
            mo.setAttribute("aria-label", "Completo");
            mo.setAttribute("data-layout-allow-overflow", "");
            mo.setAttribute("data-layout-allow-overlap", "");
            mo.setAttribute("data-layout-allow-occlusion", "");
            mo.innerHTML = '<div class="hm-in">' + STACK + LAB40 + '</div><span class="hm-ring"></span><span class="hm-t2">Completo</span>';
            root.appendChild(mo);
            const mcv = mo.querySelector(".hm-cv");
            mcv.textContent = "+40";
            gsap.set(mo, { left: 80, top: 964, x: 40, y: 96, width: ew, height: 132, borderRadius: 66 });

            tl.set(esp, { opacity: 0 }, 3.6);
            tl.set(mo, { visibility: "visible" }, 3.6);

            const out = function (el, t, dur) {
              tl.to(el, { x: -230, duration: dur, ease: "power4.in" }, t);
              tl.to(el, { opacity: 0, duration: 0.25, ease: "none" }, t);
              tl.to(el, { filter: "blur(4px)", duration: dur, ease: "power2.in" }, t);
            };
            out("#hm-h", 3.6, 0.34);
            out("#hm-sub", 3.605, 0.335);
            out("#hm-logo", 3.61, 0.33);
            out("#hm-lb", 3.6, 0.34);
            out("#hm-lm", 3.603, 0.337);
            out("#hm-lf", 3.606, 0.334);

            tl.to(mo, { x: 0, y: 0, width: 860, height: 248, borderRadius: 40, duration: 0.4, ease: "power3.inOut" }, 3.6);
            tl.to(mo.querySelector(".hm-stack"), { opacity: 0, scale: 0.8, duration: 0.2, ease: "power2.in" }, 3.62);
            tl.to(mo.querySelector(".hm-t1"), { opacity: 0, yPercent: -40, filter: "blur(4px)", duration: 0.2, ease: "power2.in" }, 3.62);
            tl.fromTo(mo.querySelector(".hm-t2"), { yPercent: 40, filter: "blur(4px)", opacity: 0 }, { yPercent: 0, filter: "blur(0px)", opacity: 1, duration: 0.26, ease: "power2.out" }, 3.72);
            tl.to(mo.querySelector(".hm-ring"), { opacity: 1, duration: 0.2, ease: "power2.out" }, 3.76);

            tl.set(mo, { visibility: "hidden" }, D);

            window.__timelines["hero"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
