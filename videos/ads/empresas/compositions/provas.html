      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          document.fonts.ready.then(function () {
            const root = document.getElementById("provas");
            const q = function (s) { return root.querySelector(s); };
            const qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
            const tl = gsap.timeline({ paused: true });

            const bez = function (x1, y1, x2, y2) {
              return function (x) {
                if (x <= 0) return 0;
                if (x >= 1) return 1;
                let lo = 0, hi = 1, t = x;
                for (let i = 0; i < 32; i++) {
                  t = (lo + hi) / 2;
                  const u = 1 - t;
                  const cx = 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t;
                  if (cx < x) lo = t; else hi = t;
                }
                const u = 1 - t;
                return 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t;
              };
            };
            const curveConsultas = bez(0.3, 0, 0.1, 1);
            const curveNota = bez(0.7, 0, 0.3, 1);
            const curveSat = bez(0.55, 0, 0.9, 0.6);

            const S = 36.5, D = 6;
            qa(".em-aurora i").forEach(function (el) {
              tl.fromTo(el, { x: -7 * S, y: -3 * S }, { x: -7 * (S + D), y: -3 * (S + D) }, 0);
              tl.to(el, { duration: D, ease: "none" }, 0);
            });
            tl.fromTo(q("#pv-white"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 5.4);

            const enter = function (el, at) {
              tl.fromTo(el, { x: 230, opacity: 0.35, filter: "blur(4px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.44, ease: "power4.out" }, at);
            };
            enter(q("#pv-head"), 0);
            enter(q("#pv-metrics"), 0);
            qa(".pv-m").forEach(function (c, i) { tl.fromTo(c, { x: 70 * i }, { x: 0, duration: 0.44, ease: "power4.out" }, 0.06 * i); });

            tl.fromTo(q("#pv-em"), { backgroundPosition: "100% 0%" }, { backgroundPosition: "0% 0%", duration: 1.4, ease: "power2.inOut" }, 0.25);

            const elCons = q('[data-m="consultas"] .pv-val');
            const elNota = q('[data-m="nota"] .pv-val');
            const elEsp = q('[data-m="espera"] .pv-val');
            const elSat = q('[data-m="satisfacao"] .pv-val');
            const star = q(".pv-star");
            const satFill = q('[data-m="satisfacao"] .pv-hair i');
            const clock = { p: 0 };
            const paint = function () {
              const p = clock.p;
              elCons.textContent = "+" + Math.round(250 * curveConsultas(p));
              const nota = curveNota(p);
              elNota.textContent = (4.8 * nota).toFixed(1).replace(".", ",");
              star.style.transform = "scale(" + nota + ") rotate(" + (-144 * (1 - nota)) + "deg)";
              const pos = 5 * p + 0.5;
              const v = Math.floor(pos);
              const f = pos - v;
              elEsp.textContent = String(v);
              elEsp.style.transform = "translateY(" + (f < 0.36 && v > 0 ? 8 * (1 - f / 0.36) : 0) + "px)";
              const sat = curveSat(p);
              elSat.textContent = Math.round(98 * sat) + "%";
              satFill.style.transform = "scaleX(" + (0.98 * sat) + ")";
            };
            tl.fromTo(clock, { p: 0 }, { p: 1, duration: 2.1, ease: "none", onUpdate: paint }, 0.3);

            const V = 90;
            const A0 = 80 + V * 1.5;
            const B0 = 80 - 3 * 828 - V * 2.5;
                        tl.fromTo(q("#pv-stripA"), { x: A0 }, { x: A0 - V * D, duration: D, ease: "none" }, 0);
            tl.fromTo(q("#pv-stripB"), { x: B0 }, { x: B0 + V * D, duration: D, ease: "none" }, 0);

            [["#pv-rowA", 0.55], ["#pv-rowB", 0.67]].forEach(function (r) {
              const el = q(r[0]);
              tl.set(el, { opacity: 0, y: 60 }, 0);
              tl.set(el, { opacity: 1 }, r[1]);
              tl.fromTo(el, { y: 60 }, { y: 0, duration: 0.5, ease: "power4.out", immediateRender: false }, r[1]);
              Array.prototype.slice.call(el.querySelectorAll(".pv-card")).forEach(function (cd, ci) {
                Array.prototype.slice.call(cd.querySelectorAll(".pv-stars svg")).forEach(function (st, si) {
                  tl.fromTo(st, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, r[1] + 0.25 + si * 0.05 + Math.min(ci, 1) * 0.12);
                });
              });
            });

            const proof = q("#pv-proof");
            tl.to(proof, { x: -1180, duration: 0.45, ease: "power2.in" }, 5.5);
            tl.to(proof, { filter: "blur(4px)", duration: 0.3, ease: "power2.in" }, 5.5);

            window.__timelines["provas"] = tl;
          });
        })();
      </script>
