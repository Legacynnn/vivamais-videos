<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/SpaceGrotesk-Medium.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/DMSans-Medium.ttf") format("truetype"); }
        #fim { --vm-safe-t: 300px; --vm-safe-r: 140px; --vm-safe-b: 680px; --vm-safe-l: 80px; --vm-fs-head: 96px; --vm-fs-sub: 84px; --vm-fs-copy: 52px; --vm-fs-label: 52px; --vm-logo-w: 210px; --vm-head-w: 860px; }
        #fim .p24-cam { position: absolute; inset: 0; transform-origin: 510px 770px; }
        #fim #fim-card { justify-content: flex-start; padding-top: 492px; gap: 72px; }
        #fim .vm-end-lockup { width: 520px; position: relative; z-index: 2; }
        #fim .vm-end-line { font-size: 84px; max-width: 860px; color: var(--p24-ink); }
        #fim .fim-cta { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 26px; padding: 36px 68px 36px 56px; border-radius: 999px; background: #451391; color: #fff; font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 88px; line-height: 1; letter-spacing: -0.01em; box-shadow: 0 34px 60px -22px rgba(69, 19, 145, 0.75), 0 0 0 8px rgba(188, 156, 247, 0.45); z-index: 2; }
        #fim .fim-cta svg { width: 84px; height: 84px; flex: none; display: block; }
        #fim .fim-cta-txt { position: relative; z-index: 1; display: block; line-height: 1; padding-bottom: 6px; }
        #fim .fim-sheen { position: absolute; top: -20%; bottom: -20%; left: 0; width: 180px; background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,0.65), rgba(255,255,255,0)); z-index: 2; pointer-events: none; }
        #fim .fim-blob-a { left: -380px; top: 80px; }
        #fim .fim-blob-b { left: 480px; top: 1000px; }
        #fim .fim-blob-c { left: 120px; top: 1300px; }
        #fim .p24-plus { left: 420px; top: 940px; width: 1100px; height: 1100px; }
        #fim #fim-confetti { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 0; }
        #fim #fim-card { position: relative; z-index: 1; }
        #fim .fim-piece { position: absolute; left: 0; top: 0; opacity: 0; }
      </style>
      <div id="fim" class="vm-scene" data-composition-id="fim" data-start="0" data-duration="2.8125" data-width="1080" data-height="1920">
        <div class="p24-bg p24-bg--light">
          <div class="p24-blob p24-blob--a fim-blob-a"></div>
          <div class="p24-blob p24-blob--b fim-blob-b"></div>
          <div class="p24-blob p24-blob--c fim-blob-c"></div>
          <div class="p24-plus"></div>
          <div class="p24-grain"></div>
        </div>
        <div class="p24-cam" data-layout-allow-overflow>
          <div id="fim-confetti" aria-hidden="true" data-layout-allow-overflow></div>
          <div id="fim-card" class="vm-end">
            <img class="vm-end-lockup" src="assets/brand/lockup-cor.svg" alt="Viva Mais">
            <p class="vm-end-line">Médico online,<br><em class="p24-hi-light">a qualquer hora.</em></p>
            <div class="fim-cta" id="fim-cta">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <span class="fim-cta-txt">vivamais.ai</span>
              <span class="fim-sheen"></span>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="fim"]');
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const cam = root.querySelector(".p24-cam");

            tl.fromTo(cam, { scale: 1.22, filter: "blur(14px)" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0);
            tl.fromTo(cam, { scale: 1 }, { scale: 1.04, duration: 2.3125, ease: "none", immediateRender: false }, 0.5);

            gsap.set(root.querySelector(".fim-blob-a"), { x: 60, scale: 1.1 });
            tl.to(root.querySelector(".fim-blob-a"), { x: -50, duration: 2.8125, ease: "none" }, 0);
            tl.to(root.querySelector(".fim-blob-a"), { scale: 1.4, duration: 0.7, ease: "power3.out" }, 0.47);
            tl.fromTo(root.querySelector(".fim-blob-b"), { x: 40 }, { x: -40, duration: 2.8125, ease: "none" }, 0);
            tl.fromTo(root.querySelector(".p24-plus"), { scale: 1.12, rotation: 6 }, { scale: 1, rotation: 0, duration: 0.5, ease: "power4.out" }, 0);
            tl.to(root.querySelector(".p24-plus"), { scale: 1.06, rotation: -2, duration: 2.3125, ease: "none" }, 0.5);

            const cta = root.querySelector("#fim-cta");
            tl.fromTo(root.querySelector(".fim-sheen"), { x: -300, skewX: -18 }, { x: 1000, skewX: -18, duration: 0.7, ease: "power2.inOut" }, 0.95);
            tl.to(cta, { scale: 0.94, duration: 0.12, ease: "power2.in" }, 1.75);
            tl.to(cta, { scale: 1.05, duration: 0.3, ease: "back.out(1.6)" }, 1.87);
            tl.to(cta, { scale: 1, duration: 0.3, ease: "power3.out" }, 2.17);

            const seed = (a) => () => {
              a |= 0; a = (a + 0x6D2B79F5) | 0;
              let t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
            const rnd = seed(2407);
            const colors = ["#FFFFFF", "#D6C3FB", "#9D6BF2", "#7E3BED", "#9681EB", "#92BFF7"];
            const layer = root.querySelector("#fim-confetti");
            const oy = 1000, t0 = 0.47;
            for (let i = 0; i < 90; i++) {
              const kind = i % 3;
              const el = document.createElement("div");
              el.className = "fim-piece";
              el.setAttribute("data-layout-allow-overflow", "");
              const c = colors[Math.floor(rnd() * colors.length)];
              el.style.background = c;
              if (kind === 0) { el.style.width = (16 + rnd() * 14) + "px"; el.style.height = (24 + rnd() * 16) + "px"; el.style.borderRadius = "4px"; }
              else if (kind === 1) { const d = 16 + rnd() * 12; el.style.width = d + "px"; el.style.height = d + "px"; el.style.borderRadius = "50%"; }
              else { el.style.width = "9px"; el.style.height = (52 + rnd() * 28) + "px"; el.style.borderRadius = "5px"; }
              layer.appendChild(el);
              const side = i % 2 ? 1 : -1;
              const ox = side < 0 ? -50 : 1130;
              const dx = -side * (60 + rnd() * 100);
              const up = 520 + rnd() * 560;
              const fall = 1300 + rnd() * 400;
              const rise = 0.42 + rnd() * 0.2;
              const dur = 1.45 + rnd() * 0.25;
              const spin = (rnd() < 0.5 ? -1 : 1) * (360 + rnd() * 720);
              const st = t0 + rnd() * 0.06;
              tl.set(el, { x: ox, y: oy, opacity: 1, rotation: rnd() * 360, scale: 0.4 }, t0);
              tl.to(el, { x: ox + dx, duration: dur, ease: "power2.out" }, st);
              tl.to(el, { y: oy - up, duration: rise, ease: "power2.out" }, st);
              tl.to(el, { y: oy + fall, duration: dur - rise, ease: "power2.in" }, st + rise);
              tl.to(el, { rotation: "+=" + spin, duration: dur, ease: "none" }, st);
              tl.to(el, { scale: 1, duration: 0.2, ease: "power3.out" }, st);
              tl.set(el, { opacity: 0 }, st + dur);
            }

            window.__timelines["fim"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
