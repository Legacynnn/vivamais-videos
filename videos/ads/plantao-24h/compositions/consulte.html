              return o;
            };
            const animOrb = (o, thinkAt) => {
              const idle = 360 / 25;
              const fast = 360 / 1.7;
              if (thinkAt == null) {
                tl.fromTo(o.spin, { rotation: 0 }, { rotation: idle * END, duration: END, ease: "none" }, 0);
                return;
              }
              const rest = END - thinkAt;
              tl.fromTo(o.spin, { rotation: 0 }, { rotation: idle * thinkAt, duration: thinkAt, ease: "none" }, 0);
              tl.to(o.spin, { rotation: idle * thinkAt + fast * rest, duration: rest, ease: "none" }, thinkAt);
              o.blobs.forEach((b) => tl.to(b.el, { x: b.dx * o.S * 0.55, y: b.dy * o.S * 0.55, duration: 0.35, ease: "power2.out" }, thinkAt));
              tl.to(o.halo, { opacity: 0.6, duration: 0.35, ease: "power2.out" }, thinkAt);
              tl.fromTo(o.sp, { rotation: 0 }, { rotation: (360 / 1.6) * rest, duration: rest, ease: "none" }, thinkAt);
              tl.set(o.orbit, { opacity: 1 }, thinkAt);
              tl.fromTo(o.orbit, { rotation: 0 }, { rotation: (360 / 1.4) * rest, duration: rest, ease: "none" }, thinkAt);
            };
            qa(".screen *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-overflow", ""); });
            qa("#c-live *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-overflow", ""); });

            const orbL = buildOrb(q("#l-orb"), 64, "ol");
            animOrb(orbL, 0.05);

            gsap.set("#c-layer, #c-bg", { transformOrigin: "540px 700px" });
            gsap.set("#c-push", { transformOrigin: "540px 900px" });

            tl.to("#b-a", { x: -150, y: 60, duration: END, ease: "none" }, 0);
            tl.to("#b-b", { x: -110, y: -40, duration: END, ease: "none" }, 0);
            tl.to("#b-c", { x: -130, duration: END, ease: "none" }, 0);
            tl.to("#b-d", { x: -90, y: 30, duration: END, ease: "none" }, 0);
            tl.to("#b-glow", { scale: 1.18, y: -60, duration: END, ease: "none" }, 0);
            tl.to("#b-plus", { rotation: -16, scale: 1.28, duration: END, ease: "none", transformOrigin: "50% 50%" }, 0);
            tl.to("#b-d", { scale: 1.3, duration: 0.9, ease: "power3.out" }, 1.9);
            tl.to("#b-b", { scale: 1.25, duration: 0.9, ease: "power3.out" }, 3.4);

            tl.fromTo("#c-push", { scale: 1 }, { scale: 1.035, duration: END, ease: "none" }, 0);

            const wordsOf = (id) => m.split(id);
            const exitLine = (ws, at) => ws.forEach((w, i) => {
              tl.to(w.parentNode, { y: -40, opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, at + i * 0.03);
            });
            const enterLine = (ws, at) => ws.forEach((w, i) => {
              const acc = w.classList.contains("vm-accent");
              tl.fromTo(w, { yPercent: 115, opacity: 0, filter: "blur(6px)", scale: acc ? 1.04 : 1 }, { yPercent: 0, opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "expo.out", immediateRender: false }, at + i * 0.06);
            });

            const p1 = wordsOf("#c-p1");
            const p2 = wordsOf("#c-p2");
            const h1 = wordsOf("#c-h1");
            const h2 = wordsOf("#c-h2");
            [p2, h1, h2].forEach((ws) => gsap.set(ws, { yPercent: 115, opacity: 0, filter: "blur(6px)", transformOrigin: "0% 70%" }));
            p1.forEach((w, i) => {
              const local = 0.3 - i * 0.06;
              lead(w, { yPercent: 112 }, { yPercent: 0 }, 0.7, Math.max(0, local), Math.max(0, -local), "power4.out");
            });
            tl.to("#c-live", { x: -1100, duration: 0.34, ease: "power4.in" }, 1.08);
            exitLine(p1, 1.1);
            enterLine(p2, 1.52);
            exitLine(p2, 3.5);
            enterLine(h1, 3.98);
            enterLine(h2, 4.12);
            exitLine(h1, 5.5);
            exitLine(h2, 5.52);

            gsap.set("#c-cam", { transformPerspective: 2400, transformOrigin: "50% 45%" });
            lead("#c-cam", { y: 300, rotationX: 14, rotationY: -9, scale: 0.94 }, { y: -40, rotationX: 0, rotationY: 0, scale: 1 }, 1.3, 0.35, 0, "power4.out");
            tl.to("#c-cam", { scale: 1.13, duration: 2.0, ease: "power2.inOut" }, 1.5);


            const enter = k.center("#t-enter");
            k.tap(enter.x + 105, enter.y, 5.9);
            tl.to("#t-enter", { scale: 0.93, duration: 0.09, ease: "power2.in", transformOrigin: "50% 50%" }, 5.9);
            tl.to("#t-enter", { scale: 1, duration: 0.2, ease: "power3.out" }, 5.99);

            tl.to("#c-layer", { scale: 1.6, filter: "blur(18px)", duration: 0.355, ease: "power4.in" }, END);
            tl.to("#c-bg", { scale: 1.6, filter: "blur(18px)", duration: 0.355, ease: "power4.in" }, END);

            window.__timelines["consulte"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
