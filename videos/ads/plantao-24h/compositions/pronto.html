              const sx = 80 + DX + (12 + 201) * S0, sy = 620 + (12 + rowY[i]) * S0;

              const t0 = 1.6 + i * 0.3;
              const pts = [[sx, sy], [sx + 90, sy - 50], [tx - 160, ty - 50], [tx, ty]];
              const mk = (id, lag, peak, baseOp) => {
                const kf = [];
                for (let k = 1; k <= N; k++) {
                  const p = ease(k / N);
                  kf.push({ x: bez(p, pts[0][0], pts[1][0], pts[2][0], pts[3][0]), y: bez(p, pts[0][1], pts[1][1], pts[2][1], pts[3][1]), width: 302 + (tileW - 302) * p, height: 64 + (tileH - 64) * p, scale: S0 * (1 + peak * Math.sin(Math.PI * p)), rotation: -3 * Math.sin(Math.PI * p), duration: T / N, ease: "none" });
                }
                const st = t0 + lag;
                gsap.set(id, { x: sx, y: sy, xPercent: -50, yPercent: -50, scale: S0, width: 302, height: 64, opacity: 0 });
                tl.set(id, { opacity: baseOp, x: sx, y: sy, scale: S0, width: 302, height: 64, rotation: 0 }, st);
                tl.to(id, { keyframes: kf }, st);
                tl.set(id, { opacity: 0 }, st + T);
              };
              mk("#fg" + i + "_2", 0.12, 0.6, 0.16);
              mk("#fg" + i + "_1", 0.06, 0.63, 0.3);
              mk("#fl" + i, 0, 0.65, 1);
              tl.to("#lr" + i, { opacity: 0, duration: 0.25, ease: "power1.in" }, t0 + 0.12);
              tl.fromTo("#tl" + i, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", immediateRender: false }, t0 + 0.32);
              const land = t0 + T;
              lands.push(land);
              tl.to("#fc" + i, { opacity: 0, duration: 0.12, ease: "power2.out" }, t0);
              tl.set(tiles[i], { opacity: 1 }, land);
              tl.fromTo(tiles[i], { scale: 1.07 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, land);

            tl.to(mainC, { y: -S2, duration: 0.9, ease: "power2.inOut" }, 3.3);
            tl.to(askEl, { borderColor: "#7E3BED", boxShadow: "0 0 0 4px rgba(157,107,242,0.35), 0 14px 44px rgba(126,59,237,0.5)", scale: 1.03, duration: 0.45, ease: "power2.out" }, 3.85);
            tl.to(askEl, { boxShadow: "0 0 0 10px rgba(157,107,242,0.16), 0 14px 52px rgba(126,59,237,0.6)", duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.4);


            tl.fromTo("#pr-dcam", { x: 0 }, { x: -800, duration: 0.4, ease: "power3.in", immediateRender: false }, 3.3);
            tl.fromTo("#pr-pcam", { x: PX, y: 40, scale: K0 }, { x: 16, y: -35, scale: 0.96, duration: 0.8, ease: O, immediateRender: false }, 3.3);
            tl.to("#pr-pcam", { x: -2, y: -45, scale: 1.0, duration: 1.9, ease: "sine.inOut" }, 4.1);
            tl.to(["#pr-dcam .dev", "#pr-pcam .dev"], { "--mk": 88, duration: 0.5, ease: "power2.out" }, 3.3);


            tl.fromTo("#pr-ba", { x: 0 }, { x: -300, duration: D, ease: "none" }, 0);
            tl.fromTo("#pr-bb", { x: 0 }, { x: -220, duration: D, ease: "none" }, 0);
            tl.fromTo("#pr-bd", { x: 0 }, { x: -180, duration: D, ease: "none" }, 0);
            tl.fromTo("#pr-bp", { rotation: 0, scale: 1 }, { rotation: -9, scale: 1.1, duration: D, ease: "none" }, 0);
            tl.to("#pr-bd", { scale: 1.3, y: -300, duration: 0.9, ease: "power3.out" }, 2.0);

            const X = D - 0.2975;
            tl.fromTo(layer, { x: 0, filter: "blur(0px)" }, { x: -130, filter: "blur(10px)", duration: 0.2975, ease: "power4.in", immediateRender: false }, X);
            tl.fromTo("#pr-bg", { x: 0 }, { x: -65, duration: 0.2975, ease: "power4.in", immediateRender: false }, X);

            root.querySelectorAll("#pr-bg *, #pr-layer *").forEach((n) => {
              n.setAttribute("data-layout-allow-overlap", "");
              n.setAttribute("data-layout-allow-occlusion", "");
              n.setAttribute("data-layout-allow-overflow", "");
            });

            window.__timelines["pronto"] = tl;
          });
        })();
      </script>
