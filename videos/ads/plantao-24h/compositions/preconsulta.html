            tl.set(seven, { backgroundColor: "#F2F1F6" }, 0);
            tl.set(sevenTxt, { color: "#726F80", fontWeight: 500 }, 0);
            tl.set(sevenLbl, { opacity: 0 }, 0);

              tl.to("#pm-ring", { opacity: 0, scale: 1.3, duration: 0.22, ease: "power2.in" }, at + 0.16);
            };

            tap(92, 456, 0.85);
            tl.set(chip, { backgroundColor: "#EBE1FD" }, 0.95);
            tl.set(chipTxt, { color: "#451391" }, 0.95);
            tl.fromTo(chip, { scale: 0.92 }, { scale: 1, duration: 0.3, ease: "back.out(1.6)", immediateRender: false }, 0.95);

            const cont = root.querySelectorAll('[aria-label="Continuar"]');

            tl.to(cont[0], { scale: 0.95, duration: 0.1, ease: "power2.in" }, 1.38);

            tap(253, 576, 2.45);

            tl.fromTo(seven, { scale: 0.88 }, { scale: 1, duration: 0.3, ease: "back.out(1.8)", immediateRender: false }, 2.55);

            tap(246, 686, 3.2);
            tl.to(cont[1], { scale: 0.95, duration: 0.1, ease: "power2.in" }, 3.28);
            tl.to(cont[1], { scale: 1, duration: 0.2, ease: "power3.out" }, 3.38);

            tl.to([words, sub, "#pc-eyebrow"], { x: -220, duration: 0.19, ease: "power4.in" }, X);
