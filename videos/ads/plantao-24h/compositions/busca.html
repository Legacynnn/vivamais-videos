                      <div class="bs-st-right"><div class="bs-st-pos" style="position:relative"><span id="bs-pa">3º · 6 min</span><span id="bs-pb" style="position:absolute;left:12px;top:6px;opacity:0">1º · 2 min</span></div><div class="bs-st-x"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
                    </div>
                  </div>
                  <div class="bs-st-bot">
                    <div class="bs-st-copy"><div class="bs-st-t">Receita direto no app.</div><div class="bs-st-b">Receita, atestado e pedido de exames ficam salvos na sua consulta, prontos pra mostrar na farmácia.</div></div>
                    <div class="bs-st-btn">Próximo</div>
                  </div>
                </div>
              </div>
              <div class="lift"></div>
            </div>

      </div>
      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="busca"]');
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const m = VMMotion.create({ root, tl });
            const k = VMKit.create({ root, tl });
            const q = (s) => root.querySelector(s);
            const qa = (s) => [...root.querySelectorAll(s)];
            const X = 6.6875;
            const DUR = 7.03125;

            qa(".screen *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-overflow", ""); });

            tl.fromTo("#bs-c-layer, #bs-logo", { x: 130, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.38, ease: "power4.out" }, 0);

            tl.to("#bs-b-a", { x: -150, y: 60, duration: DUR, ease: "none" }, 0);
            tl.to("#bs-b-b", { x: -110, y: -40, duration: DUR, ease: "none" }, 0);
            tl.to("#bs-b-c", { x: -130, duration: DUR, ease: "none" }, 0);
            tl.to("#bs-b-d", { x: -90, y: 30, duration: DUR, ease: "none" }, 0);
            tl.to("#bs-b-glow", { scale: 1.18, y: -60, duration: DUR, ease: "none" }, 0);
            tl.to("#bs-b-plus", { rotation: -16, scale: 1.28, duration: DUR, ease: "none", transformOrigin: "50% 50%" }, 0);

            const outX = (w) => -(w.offsetWidth + 40);
            const exitLine = (ws, at) => ws.forEach((w, i) => {
              tl.to(w, { x: outX(w), duration: 0.3, ease: "power4.in" }, at + i * 0.03);
              tl.to(w, { opacity: 0, duration: 0.11, ease: "power1.in" }, at + 0.03 + i * 0.025);
            });
            const hA = m.split("#bs-h1");
            const hB = m.split("#bs-h2");
            gsap.set(hB, { opacity: 0 });
            tl.fromTo(hA, { x: 0, y: 36, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.42, ease: "power3.out", stagger: 0.07 }, 0.2);
            exitLine(hA, 3.56);
            tl.fromTo(hB, { x: 0, y: 36, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.42, ease: "power3.out", stagger: 0.09, immediateRender: false }, 3.94);
            exitLine(hB, X);

            gsap.set("#bs-c-cam", { transformPerspective: 2400, transformOrigin: "309px 0px", scale: 1.07, y: -262 });

            qa('#bs-rd [style*="rotate(-2deg)"] > img, #bs-cl [style*="rotate(-2deg)"] > img').forEach((im) => {
              im.setAttribute("src", "assets/img/doutora-pre.jpg");
              im.style.objectFit = "cover";
              im.style.objectPosition = "50% 18%";
            });

            const ST = { q3: "#bs-q3", q1: "#bs-q1", rd: "#bs-rd", cl: "#bs-cl" };
            gsap.set(Object.values(ST), { opacity: 0 });
            const fadeIn = (sel, at, dur) => tl.to(sel, { opacity: 1, duration: dur || 0.3, ease: "power2.out" }, at);

            const numBox = (sel) => q(sel).querySelector('[style*=" height: 104px"]');
            const roll = (fromSel, toSel, at) => {
              const a = numBox(fromSel).children[0];
              const b = numBox(toSel).children[0];
              tl.to(a, { y: -104, opacity: 0, duration: 0.5, ease: "power3.inOut" }, at);
              tl.fromTo(b, { y: 104, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut", immediateRender: false }, at);
              fadeIn(toSel, at, 0.34);
            };
            tl.fromTo(numBox("#bs-q4").children[0], { scale: 0.9, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.25);
            roll("#bs-q4", "#bs-q3", 0.9);
            roll("#bs-q3", "#bs-q1", 2.9);
            tl.fromTo(numBox("#bs-q1").children[0], { scale: 1 }, { scale: 1.06, transformOrigin: "0% 50%", duration: 0.28, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 3.55);

            const card = q("#bs-q3").querySelector('[aria-label="Abrir história: Receita no app"]');
            const cc = k.center(card);
            k.tap(cc.x, cc.y, 1.95, card);
            gsap.set("#bs-st", { transformOrigin: cc.x + "px " + cc.y + "px" });
            tl.fromTo("#bs-st", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.0);
            tl.fromTo("#bs-st .bs-st-bars b", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "none", immediateRender: false }, 2.1);
            tl.fromTo("#bs-st .bs-st-t, #bs-st .bs-st-b, #bs-st .bs-st-btn", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out", stagger: 0.06, immediateRender: false }, 2.12);
            tl.to("#bs-pa", { opacity: 0, duration: 0.2 }, 2.9);
            tl.to("#bs-pb", { opacity: 1, duration: 0.2 }, 2.9);
            tl.to("#bs-st", { opacity: 0, scale: 0.6, duration: 0.25, ease: "power2.in" }, 3.2);

            ["#bs-q4", "#bs-q3", "#bs-q1"].forEach((sel) => {
              const sheet = q(sel).querySelector('[style*="margin-top: -18px"]');
              sheet.style.overflow = "hidden";
              tl.to([...sheet.children].slice(1), { y: -34, duration: 0.7, ease: "power2.inOut" }, 1.3);
            });

            fadeIn("#bs-rd", 3.89, 0.34);
            tl.to("#bs-c-status", { color: "#17151E", duration: 0.3, ease: "power1.out" }, 3.89);
            const cardRd = q("#bs-rd").querySelector('[style*="rotate(-2deg)"]');
            tl.fromTo(cardRd, { scale: 0.5, y: 90, rotation: -14, opacity: 0 }, { scale: 1, y: 0, rotation: -2, opacity: 1, duration: 0.8, ease: "back.out(1.7)", immediateRender: false }, 3.94);
            const checks = qa("#bs-rd .lucide-check").map((n) => n.parentElement);
            checks.forEach((c, i) => {
              tl.fromTo(c, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 4.24 + i * 0.24);
            });

            fadeIn("#bs-cl", 4.89, 0.3);
            const cdBox = q("#bs-cl").querySelector('[aria-label="Entrando na chamada em 3…"] [style*=" height: 22px"]');
            const l0 = cdBox.children[0];
            const l1 = cdBox.children[1];
            const l2 = l1.cloneNode(true);
            cdBox.appendChild(l2);
            l1.querySelector(".rn-text").textContent = "2";
            l2.querySelector(".rn-text").textContent = "1";
            gsap.set([l1, l2], { opacity: 0 });
            const tick = (a, b, at) => {
              tl.to(a, { y: -22, opacity: 0, duration: 0.3, ease: "power2.inOut" }, at);
              tl.fromTo(b, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, at);
            };
            tick(l0, l1, 5.54);
            tick(l1, l2, 5.94);
            const sc = q("#bs-cl .rn-scroll-content");
            tl.to(sc, { y: -75, duration: 0.55, ease: "power2.inOut" }, 5.14);

            const btn = q('#bs-cl [aria-label="Entrar na chamada"]');
            tl.fromTo(btn, { scale: 1 }, { scale: 1.03, duration: 0.22, ease: "power1.inOut", yoyo: true, repeat: 3, immediateRender: false }, 5.39);
            k.tap(201, 816, 6.29, btn);
            tl.to(btn, { scale: 0.97, duration: 0.1, ease: "power2.in" }, 6.29);

            tl.to("#bs-c-layer", { x: -300, filter: "blur(10px)", duration: 0.34, ease: "power4.in" }, X);
            tl.to("#bs-c-bg", { x: -120, duration: 0.34, ease: "power4.in" }, X);

            window.__timelines["busca"] = tl;
          });
        })();
      </script>
    </template>
