      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="ia"]');
          window.__timelines = window.__timelines || {};
          const q = (s) => root.querySelector(s);
          const qa = (s) => [...root.querySelectorAll(s)];
          const END = 4.21875;
          const EXIT = 3.92;

          document.fonts.ready.then(async () => {
            await Promise.all([...document.fonts].map((f) => f.load().catch(() => null)));
            const tl = gsap.timeline({ paused: true });
            const scr = q("#ia-scr");

            const leaf = (txt) => [...scr.querySelectorAll("div")].find((e) => !e.children.length && e.textContent === txt);
            const qText = leaf("Como tomo a receita?");
            const userBlock = qText.parentElement.parentElement;
            const aiBlock = userBlock.nextElementSibling;
            const aiLabel = aiBlock.children[0];
            const aiBody = aiBlock.children[1];
            const copyRow = aiBlock.children[2];
            const paras = [...aiBody.children];

            const split = (el, cls, perChar) => {
              const out = [];
              const walk = (node) => {
                [...node.childNodes].forEach((c) => {
                  if (c.nodeType === 3) {
                    const frag = document.createDocumentFragment();
                    c.textContent.split(perChar ? /()/ : /(\s+)/).forEach((tok) => {
                      if (!tok) return;
                      if (!perChar && /^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(tok)); return; }
                      const s = document.createElement("span");
                      s.className = cls;
                      s.style.opacity = "0";
                      s.textContent = tok;
                      frag.appendChild(s);
                      out.push(s);
                    });
                    c.replaceWith(frag);
                  } else if (c.nodeType === 1) walk(c);
                });
              };
              walk(el);
              return out;
            };
            const chars = split(qText, "ic", true);
            const words = paras.flatMap((p) => split(p, "iw", false));

            const spin = scr.querySelector('[aria-label="Super IA disponível"] [style*="rotate(0deg)"]');

            qa("#ia-cam *, #ia-head, #ia-sub, #ia-bg, #ia-bg *").forEach((n) => {
              n.setAttribute("data-layout-allow-overlap", "");
              n.setAttribute("data-layout-allow-occlusion", "");
              n.setAttribute("data-layout-allow-overflow", "");
            });
            q("#ia-cam").setAttribute("data-layout-allow-overflow", "");

            const layer = q("#ia-layer");
            tl.fromTo(layer, { x: 130, filter: "blur(10px)" }, { x: 0, filter: "blur(0px)", duration: 0.38, ease: "power4.out" }, 0);
            tl.fromTo("#ia-bg", { x: 65 }, { x: 0, duration: 0.38, ease: "power4.out" }, 0);

            tl.fromTo("#ia-ba", { x: 0 }, { x: -260, duration: END, ease: "none" }, 0);
            tl.fromTo("#ia-bb", { x: 0 }, { x: -200, duration: END, ease: "none" }, 0);
            tl.fromTo("#ia-bc", { x: 0 }, { x: -140, duration: END, ease: "none" }, 0);
            tl.fromTo("#ia-bd", { x: 0 }, { x: -180, duration: END, ease: "none" }, 0);
            tl.fromTo("#ia-bp", { rotation: 0, scale: 1 }, { rotation: -8, scale: 1.08, duration: END, ease: "none" }, 0);

            tl.fromTo("#ia-cam", { scale: 1 }, { scale: 1.035, duration: EXIT, ease: "none" }, 0);

            if (spin) {
              tl.fromTo(spin, { rotation: 0 }, { rotation: (360 / 25) * 0.85 + (360 / 1.7) * (1.85 - 0.85) + (360 / 25) * (END - 1.85), duration: END, ease: "none" }, 0);
            }

            const chat = scr.querySelector(".rn-scroll-content");
            tl.fromTo(chat, { y: -150 }, { y: -150, duration: 0.01 }, 0);
            tl.to(chat, { y: -300, duration: 0.9, ease: "power2.out" }, 1.0);

            tl.set(userBlock, { opacity: 0 }, 0);
            tl.fromTo(userBlock, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.5);
            chars.forEach((c, i) => tl.set(c, { opacity: 1 }, 0.55 + (0.35 * i) / (chars.length - 1)));

            tl.set(aiLabel, { opacity: 0 }, 0);
            tl.fromTo(aiLabel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.0);

            const t0 = 1.25;
            const t1 = 1.85;
            words.forEach((w, i) => tl.set(w, { opacity: 1 }, t0 + ((t1 - t0) * i) / (words.length - 1)));

            tl.set(copyRow, { opacity: 0 }, 0);
            tl.fromTo(copyRow, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.9);

            tl.fromTo(layer, { x: 0, filter: "blur(0px)" }, { x: -130, filter: "blur(10px)", duration: END - EXIT, ease: "power4.in", immediateRender: false }, EXIT);
            tl.fromTo("#ia-bg", { x: 0 }, { x: -65, duration: END - EXIT, ease: "power4.in", immediateRender: false }, EXIT);

            window.__timelines["ia"] = tl;
          });
        })();
      </script>
