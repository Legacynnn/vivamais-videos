      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          document.fonts.ready.then(function () {
            const B = 0.46875;
            const D = 5.625;
            const tl = gsap.timeline({ paused: true });
            const rails = [...document.querySelectorAll("#fim .fim-rail")];
            const chips = [...document.querySelectorAll("#fim .fim-chip")];
            gsap.set("#fim-logo", { opacity: 0 });
            gsap.set("#fim-line", { opacity: 0, scale: 1.12, filter: "blur(18px)", transformOrigin: "50% 50%" });
            gsap.set(rails, { opacity: 0, y: 50, filter: "blur(12px)" });
            gsap.set(chips, { opacity: 0, scale: 0.88, filter: "blur(14px)" });
            gsap.set("#fim-glow", { opacity: 0 });
            gsap.set("#fim-sub", { opacity: 0, y: 20, filter: "blur(10px)" });
            gsap.set("#fim-link", { opacity: 0, y: 30, filter: "blur(14px)" });

            tl.to("#fim-line", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0);
            tl.to("#fim-glow", { opacity: 0.55, duration: 0.6, ease: "power2.out" }, 0.1);
            tl.to("#fim-sub", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.35);
            tl.to("#fim-logo", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.15);
            rails.forEach(function (el, i) { tl.to(el, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.45 + i * 0.12); });
            tl.fromTo("#fim-strip-0", { x: -90 }, { x: -90 - 140 * D, duration: D, ease: "none", immediateRender: true }, 0);
            tl.fromTo("#fim-strip-1", { x: -1500 }, { x: -1500 + 140 * D, duration: D, ease: "none", immediateRender: true }, 0);
            const DX = [6, -5, 5, -6];
            const DY = [-7, 7, -6, 7];
            chips.forEach(function (el, i) {
              tl.to(el, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.9 + i * 0.2);
              tl.fromTo(el.firstElementChild, { x: -DX[i], y: -DY[i] }, { x: DX[i], y: DY[i], duration: D, ease: "sine.inOut", immediateRender: true }, 0);
            });
            tl.to("#fim-link", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 1.1);
            const P = 2 * B;
            const P0 = 1.8;
            const n = Math.ceil((D - P0) / P);
            for (let i = 0; i < n; i++) {
              const t = P0 + i * P;
              tl.fromTo("#fim-ring", { scale: 1, opacity: 0.28 }, { scale: 1.15, opacity: 0, duration: 0.85, ease: "power2.out", immediateRender: false }, t);
              tl.to("#fim-link", { scale: 1.03, duration: B / 2, ease: "sine.out" }, t);
              tl.to("#fim-link", { scale: 1, duration: B / 2, ease: "sine.in" }, t + B / 2);
              tl.to("#fim-link", { boxShadow: "inset 0 2px 0 rgba(255,255,255,0.28), 0 6px 14px rgba(126,59,237,0.38), 0 24px 48px -10px rgba(126,59,237,0.55), 0 50px 90px -24px rgba(53,14,111,0.5)", duration: B / 2, ease: "sine.out" }, t);
              tl.to("#fim-link", { boxShadow: "inset 0 2px 0 rgba(255,255,255,0.28), 0 4px 10px rgba(126,59,237,0.30), 0 18px 36px -10px rgba(126,59,237,0.45), 0 40px 80px -24px rgba(53,14,111,0.45)", duration: B / 2, ease: "sine.in" }, t + B / 2);
            }
            const TAP = 4.2;
            tl.to("#fim-tap", { opacity: 1, duration: 0.12, ease: "power2.out" }, TAP - 0.12);
            tl.to("#fim-link", { scale: 0.96, duration: 0.12, ease: "power2.in", overwrite: "auto" }, TAP);
            tl.fromTo("#fim-ring", { scale: 1, opacity: 0.45 }, { scale: 1.22, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, TAP);
            tl.to("#fim-link", { scale: 1, duration: 0.25, ease: "back.out(2)" }, TAP + 0.12);
            tl.to("#fim-tap", { opacity: 0, duration: 0.25, ease: "power2.in" }, TAP + 0.25);
            const TP = 0.7;
            const m = Math.ceil((D - TP) / P);
            for (let i = 0; i < m; i++) {
              const t = TP + i * P;
              tl.to("#fim-t24", { scale: 1.04, duration: B, ease: "sine.inOut" }, t);
              tl.to("#fim-t24", { scale: 1, duration: B, ease: "sine.inOut" }, t + B);
              tl.to("#fim-glow", { opacity: 0.95, scale: 1.08, duration: B, ease: "sine.inOut" }, t);
              tl.to("#fim-glow", { opacity: 0.55, scale: 1, duration: B, ease: "sine.inOut" }, t + B);
            }
            tl.fromTo("#fim-cam", { scale: 1 }, { scale: 1.025, duration: D, ease: "none" }, 0);
            window.__timelines["fim"] = tl;
          });
        })();
