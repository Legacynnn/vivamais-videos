            tl.fromTo(cam, { x: 540 - 426 * 1.4 / 2, y: 780, scale: 1.4, opacity: 0, filter: "blur(14px)" }, { x: C0.x, y: C0.y, scale: S0, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power4.out" }, 0);

            tl.set(ring, { x: 510, y: MACRO }, 2.8);
            dotTap(2.8125);
            tl.fromTo(entrar, { scale: 1 }, { scale: 0.95, backgroundColor: "#6A2BD0", duration: 0.1, ease: "power2.in", immediateRender: false }, 2.8125);
            tl.to(dot, { y: MACRO + 300, x: 760, opacity: 0, duration: 0.3, ease: "power3.in" }, 2.97);

            [...words].reverse().forEach((w, i) => {

            tl.to(cam, { x: vZ.x, y: vZ.y, scale: vZ.scale, filter: "blur(18px)", duration: 0.47, ease: "power3.in" }, 3.28);
