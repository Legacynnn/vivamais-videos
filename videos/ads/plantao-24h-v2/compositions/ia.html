              return dot;
            };

            tapAt(cardCx + 70, cardCy + 6, 0.94, [160, 300]);
            tl.fromTo(card, { scale: 1 }, { scale: 0.97, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, 0.94);

            tl.set(B, { autoAlpha: 1 }, 1.0);
            tl.fromTo(B, { x: 402 }, { x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 1.0);
            tl.to(A, { x: -120, duration: 0.5, ease: "power3.out" }, 1.0);
            tl.set(A, { autoAlpha: 0 }, 1.52);

            tl.to(sendGrad, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.75);
            tl.set(ph, { display: "none" }, 1.6);
            tl.set(ty, { display: "inline" }, 1.6);
            tl.to(inChars, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.03 }, 1.6);

            tapAt(sendX, sendY, 2.75, [-200, 70]);
            tl.fromTo(sendBtn, { scale: 1 }, { scale: 0.9, duration: 0.1, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, 2.75);
            tl.set(ty, { display: "none" }, 2.83);
            tl.set(ph, { display: "inline" }, 2.83);
            tl.to(sendGrad, { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.83);

            tl.to(userGroup, { opacity: 1, duration: 0.01 }, 2.85);
            tl.to(bubble1, { y: 0, duration: 0.4, ease: "power4.out" }, 2.85);
            tl.to(hdr1, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 3.15);
            const WS = 3.3;
            const WE = 4.5;
            tl.to(words1, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.2, ease: "power3.out", stagger: (WE - WS - 0.2) / words1.length }, WS);
            if (excess > 0) tl.to(content, { y: -excess, duration: WE - WS, ease: "none" }, WS);
            tl.to(copy1, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 4.55);
            tl.to(chip, { scale: 1.06, backgroundColor: "rgb(126, 59, 237)", duration: 0.3, ease: "power2.out" }, 5.0);
            tl.to(chip.firstChild, { color: "#FFFFFF", duration: 0.3, ease: "power2.out" }, 5.0);
            tl.to(lineChars, { rotateX: 90, duration: 0.28, ease: "power2.in", stagger: lcStep }, 6.0);
            tl.to(lineChars, { opacity: 0, duration: 0.168, ease: "none", stagger: lcStep }, 6.0);
            tl.to(view, { scale: 0.82, filter: "blur(14px)", opacity: 0, duration: 0.5625, ease: "power3.in" }, 6.0);
          };
          document.fonts.ready.then(build);
        })();
      </script>
