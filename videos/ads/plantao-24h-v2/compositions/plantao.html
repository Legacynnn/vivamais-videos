      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="plantao"]');
          window.__timelines = window.__timelines || {};
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const q = (s) => root.querySelector(s);
            const clock = q("#pl-clock"), face = q("#pl-face"), crown = q("#pl-crown");
            const hand = q("#pl-hand"), hs = q("#pl-hs"), ring = q("#pl-ring");
            const nums = [...q("#pl-num").querySelectorAll("span")];
            const text = q("#pl-text");
            const BEAT = 0.46875;
            const C = 1482.8;
            const A0 = 10;
            const STEP = 6;

            const chars = [];
            text.querySelectorAll(".pl-w").forEach((w) => {
              const txt = w.textContent;
              w.textContent = "";
              [...txt].forEach((c) => {
                const s = document.createElement("span");
                s.className = "pl-ch";
                s.textContent = c;
                w.appendChild(s);
                chars.push(s);
              });
            });
            const cascade = (t0, dir, spread) => {
              const st = spread / chars.length;
              chars.forEach((c, i) => {
                const t = t0 + i * st;
                if (dir === "in") {
                  tl.fromTo(c, { rotationX: -90, opacity: 0, transformPerspective: 600, transformOrigin: "50% 50% -30px" }, { rotationX: 0, duration: 0.34, ease: "power3.out", immediateRender: true }, t);
                  tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.34 * 0.4, ease: "none", immediateRender: false }, t);
                } else {
                  tl.to(c, { rotationX: 90, duration: 0.28, ease: "power2.in" }, t);
                  tl.to(c, { opacity: 0, duration: 0.28 * 0.6, ease: "none" }, t);
                }
              });
            };

            gsap.set([hand, hs], { svgOrigin: "320 320", rotation: A0 });
            gsap.set(ring, { strokeDashoffset: C * (1 - A0 / 360) });

            tl.fromTo(clock, { scale: 0.7, opacity: 0, filter: "blur(16px)" }, { scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out", immediateRender: true }, 0);
            tl.to(clock, { opacity: 1, duration: 0.15, ease: "none" }, 0);
            tl.to(clock, { scale: 2.2, filter: "blur(16px)", duration: 0.35, ease: "power2.in" }, 1.525);
            tl.to(clock, { opacity: 0, duration: 0.12, ease: "none" }, 1.755);

            const st = { a: A0 };
            const apply = () => {
              gsap.set([hand, hs], { rotation: st.a });
              gsap.set(ring, { strokeDashoffset: C * (1 - st.a / 360) });
            };
            for (let k = 1; k <= 3; k++) {
              const t = k * BEAT;
              tl.to(st, { a: A0 + k * STEP, duration: 0.3, ease: "back.out(2.8)", onUpdate: apply }, t);
              tl.fromTo(face, { scale: 1 }, { scale: 1.03, duration: 0.07, ease: "power2.out", immediateRender: false }, t);
              tl.to(face, { scale: 1, duration: 0.22, ease: "power2.out" }, t + 0.07);
              tl.fromTo(crown, { y: 0 }, { y: 16, duration: 0.06, ease: "power2.out", immediateRender: false }, t);
              tl.to(crown, { y: 0, duration: 0.25, ease: "back.out(3)" }, t + 0.06);
              tl.to(nums[k - 1], { opacity: 0, y: -14, duration: 0.06, ease: "power1.in" }, t);
              tl.fromTo(nums[k], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.16, ease: "back.out(2)", immediateRender: false }, t + 0.07);
            }

            cascade(0, "in", 0.3);
            cascade(1.5, "out", 0.1);

            window.__timelines["plantao"] = tl;
          });
        })();
