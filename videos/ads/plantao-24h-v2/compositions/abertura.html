      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="abertura"]');
          window.__timelines = window.__timelines || {};
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const q = (s) => root.querySelector(s);
            const two = q("#ab-two");
            const split = (line) => {
              const out = [];
              line.querySelectorAll(".v2-word").forEach((w) => {
                const txt = w.textContent;
                w.textContent = "";
                [...txt].forEach((c) => {
                  const s = document.createElement("span");
                  s.className = "ab-ch";
                  s.textContent = c;
                  s.style.fontSize = "inherit";
                  w.appendChild(s);
                  out.push(s);
                });
              });
              return out;
            };
            const cascade = (chars, t0, dir, spread) => {
              const st = Math.min(0.014, spread / chars.length);
              chars.forEach((c, i) => {
                const fs = parseFloat(getComputedStyle(c).fontSize);
                const base = { transformPerspective: 600, transformOrigin: "50% 50% " + (-0.5 * fs) + "px", backfaceVisibility: "hidden" };
                const t = t0 + i * st;
                if (dir === "in") {
                  tl.fromTo(c, Object.assign({ rotationX: -90, opacity: 0 }, base), { rotationX: 0, duration: 0.34, ease: "power3.out", immediateRender: true }, t);
                  tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.34 * 0.4, ease: "none", immediateRender: false }, t);
                } else {
                  tl.set(c, base, 0);
                  tl.to(c, { rotationX: 90, duration: 0.28, ease: "power2.in" }, t);
                  tl.to(c, { opacity: 0, duration: 0.28 * 0.6, ease: "none" }, t);
                }
              });
            };
            const one = q("#ab-one"), pl = q("#ab-pl"), cam = q("#ab-cam");
            const ow = [...one.querySelectorAll(".v2-word")];
            tl.set(ow[3], { transformOrigin: "50% 65%" }, 0);
            tl.fromTo(ow[3], { scale: 1 }, { scale: 1.07, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 1.13);

            gsap.set(cam, { x: 269, y: 520, scale: 0.74 });
            gsap.set(pl, { transformOrigin: "540px 1100px" });
            tl.fromTo(pl, { rotationY: -7, rotationX: 4, scale: 0.97 }, { rotationY: 0, rotationX: 0, scale: 1, duration: 2.4, ease: "power2.out", immediateRender: true }, 0);
            tl.to(pl, { scale: 1.04, duration: 5.6, ease: "none" }, 2.4);
            tl.to(cam, { x: 254, y: 550, scale: 0.78, duration: 0.6, ease: "power2.inOut" }, 2.85);

            const oneCh = split(one), twoCh = split(two);
            cascade(oneCh, 2.9, "out", 0.12);
            tl.to(one, { y: -190, duration: 0.4, ease: "power2.in" }, 2.9);
            cascade(twoCh, 3.16, "in", 0.25);
            tl.fromTo(two, { y: 190 }, { y: 0, duration: 0.5, ease: "power2.out", immediateRender: true }, 3.16);

            const cl = q("#ab-cl"), cr = q("#ab-cr");
            tl.fromTo(cl, { x: -520, opacity: 0 }, { x: 0, duration: 0.6, ease: "back.out(1.1)", immediateRender: true }, 3.4);
            tl.fromTo(cl, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, 3.4);
            tl.fromTo(cr, { x: 520, opacity: 0 }, { x: 0, duration: 0.6, ease: "back.out(1.1)", immediateRender: true }, 3.5);
            tl.fromTo(cr, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, 3.5);
            tl.to(cl, { x: 14, duration: 4.0, ease: "none" }, 4.0);
            tl.to(cr, { x: -14, duration: 4.0, ease: "none" }, 4.1);

            const call = q("#ab-call"), home = q("#ab-home"), dot = q("#ab-dot"), ring = q("#ab-ring");
            const tile = root.querySelector('[aria-label="Abrir plantão 24h"]');
            tl.set(call, { x: 402 }, 0);
            tl.fromTo(dot, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: true }, 2.45);
            tl.to(dot, { scale: 0.82, duration: 0.1, ease: "power2.out" }, 2.7);
            if (tile) {
              tl.set(tile, { transformOrigin: "50% 50%" }, 0);
              tl.to(tile, { scale: 0.94, duration: 0.1, ease: "power2.out" }, 2.7);
              tl.to(tile, { scale: 1, duration: 0.2, ease: "power2.out" }, 2.8);
            }
            tl.fromTo(ring, { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.8, duration: 0.45, ease: "power2.out", immediateRender: false }, 2.72);
            tl.to(dot, { opacity: 0, duration: 0.12, ease: "power1.in" }, 2.8);
            tl.to(call, { x: 0, duration: 0.4, ease: "power3.out" }, 2.8);
            tl.to(home, { x: -100, duration: 0.4, ease: "power3.out" }, 2.8);

            cascade(twoCh, 7.95, "out", 0.15);
            tl.to(cl, { x: -560, opacity: 0, duration: 0.35, ease: "power2.in", overwrite: "auto" }, 7.95);
            tl.to(cr, { x: 560, opacity: 0, duration: 0.35, ease: "power2.in", overwrite: "auto" }, 7.95);
            tl.to(pl, { scale: 2.6, filter: "blur(20px)", duration: 0.4375, ease: "power2.in" }, 8.0);
            tl.to(pl, { opacity: 0, duration: 0.2375, ease: "power1.in" }, 8.2);

            window.__timelines["abertura"] = tl;
          });
        })();
      </script>
