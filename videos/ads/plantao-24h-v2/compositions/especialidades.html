        (function () {
          window.__timelines = window.__timelines || {};
          document.fonts.ready.then(function () {
            const B = 0.46875;
            const D = 3.75;
            const X = 3.28;
            const tl = gsap.timeline({ paused: true });
            const rows = [...document.querySelectorAll("#especialidades .esp-row")];
            gsap.set("#esp-logo", { opacity: 0 });
            gsap.set("#esp-line", { opacity: 0, scale: 1.06, filter: "blur(14px)", transformOrigin: "50% 50%" });
            gsap.set("#esp-sub", { opacity: 0, y: 20, filter: "blur(10px)" });
            tl.to("#esp-logo", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
            tl.to("#esp-line", { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "power4.out" }, 0);
            tl.to("#esp-sub", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power4.out" }, B * 0.65);
            const SPEED = [160, 210, 175, 225];
            rows.forEach(function (row, r) {
              const chips = [...row.children];
              const mid = (chips.length - 1) / 2;
              gsap.set(chips, { opacity: 0, y: 44, filter: "blur(10px)" });
              chips.forEach(function (el, c) {
                tl.to(el, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power4.out" }, 0.35 + r * 0.3 + Math.abs(c - mid) * 0.09);
              });
              const dir = r % 2 ? 1 : -1;
              const half = SPEED[r] * D / 2;
              tl.fromTo(row, { x: -dir * half }, { x: dir * half, duration: D, ease: "none", immediateRender: true }, 0);
            });
            tl.to(["#esp-line", "#esp-sub", "#esp-grid", "#esp-logo"], { x: -180, opacity: 0, filter: "blur(14px)", duration: D - X, ease: "power2.in", stagger: 0.04, overwrite: "auto" }, X);
            window.__timelines["especialidades"] = tl;
          });
        })();
