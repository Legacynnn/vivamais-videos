            m.slide("#s06-head", 0, { x: 70 });

            const filt = center('#s06-sA [aria-label^="Filtros"]');

            const dia = center('#s06-sB [aria-label="Amanhã"]');

            const ben = center('#s06-sB [aria-label="Especialistas"]');
            const sbScr = root.querySelector("#s06-sB");
            const overlay = (label, t) => {
              const orig = root.querySelector('#s06-sB [aria-label="' + label + '"]');
              const from = root.querySelector('#s06-sC [aria-label="' + label + '"]');
              const p = k.posIn(orig);
              const w = document.createElement("div");

              Object.assign(c.style, { position: "absolute", left: "0px", top: "0px", height: p.h + "px", margin: "0", whiteSpace: "nowrap" });

              k.liftEl.appendChild(w);
              tl.to(w, { opacity: 1, duration: 0.08, ease: "none" }, t);
              tl.set(w, { opacity: 0 }, 2.1);

            overlay("Qualquer dia", 1.3);
            overlay("Amanhã", 1.3);
            tap(dia.x, dia.y, 1.3, '#s06-sB [aria-label="Amanhã"]');

            const y0 = 452, gh = 300, dx = 175;

            group.appendChild(inner);
            const gx = 14 + 187;
            const gy = y0 + gh / 2;
            tl.to(cam, { x: -150, duration: 0.5, ease: "power3.inOut" }, 2.4);
            tl.set(cover, { opacity: 1 }, 2.5);
            tl.set(group, { opacity: 1 }, 2.5);
            tl.fromTo(group, { scale: 1, x: 0, y: 0 }, { scale: 1.3, x: dx, y: 0, duration: 0.6, ease: "power3.out" }, 2.5);
            tl.to(group, { scale: 1, x: 0, y: 0, duration: 0.45, ease: "power3.inOut" }, 3.4);
            tl.set(group, { opacity: 0 }, 3.9);
            tl.set(cover, { opacity: 0 }, 3.9);
            const tp = tip("Dia, formato e benefício", gx + dx, gy - (gh * 1.3) / 2, "up");

            tl.fromTo("#s06-sE", { x: 402 }, { x: 0, duration: 0.5, ease: "power3.out" }, 4.75);

            m.exit("#s06-head", 4.5);
