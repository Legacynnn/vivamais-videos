            const sp = k.posIn(label);
            const cover = content.parentElement.previousElementSibling;
            const maxY = Math.max(0, content.offsetHeight - content.parentElement.offsetHeight);
            const scrollY = Math.min(maxY, Math.max(0, Math.round(sp.y + sp.h / 2 - 437)));
            const credit = k.posIn(root.querySelector(creditSel));
            const disc = k.posIn(root.querySelector(discSel));
            const last = k.posIn(rowContent.lastElementChild);
            const maxX = Math.max(0, last.x + last.w + 8 - 402);
            const scrollX = Math.min(maxX, Math.max(0, disc.x - 16));

            tl.set([content, cover], { y: -scrollY }, 0);
            k.screens(["s03-sA", "s03-sB"]);

            m.rise("#s03-head", 0);

            const camTo = (x, t) => tl.to(cam, { x, duration: 0.5, ease: "power3.inOut" }, t);

              node.style.top = p.y - scrollY + "px";
              const cardRight = p.x - sx + p.w / 2 + dx + (p.w * sc) / 2;

              k.showTip(tp, tipAt, tipHold);

            lift(creditSel, credit, 0, 0.9, 1.2, fit(credit, 0, 1.4), 1.4, "Pago pela empresa", 1.2, 0.85);

            tl.to(rowContent, { x: -scrollX, duration: 0.5, ease: "power2.inOut" }, 2.55);
