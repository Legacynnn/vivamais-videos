            const { $, tap, center, tip, showTip, liftOut } = k;

            const layer = (id) => root.querySelector("#" + id + ' [style*="z-index: 40"]');

            tl.fromTo(sheetA, { y: H * 0.6 }, { y: 0, duration: 0.6, ease: "power2.out" }, 0);
