<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Space Grotesk"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/SpaceGrotesk-Medium.ttf") format("truetype"); }
        @font-face { font-family: "DM Sans"; font-weight: 500; font-display: block; src: url("assets/brand/fonts/DMSans-Medium.ttf") format("truetype"); }
        #s11-fim .vm-end-cta { background: var(--vm-secondary-strong); color: var(--vm-white, #fff); }
      </style>
      <div id="s11-fim" class="vm-scene vm-bg-canvas" data-composition-id="s11-fim" data-start="0" data-duration="4" data-width="1080" data-height="1920">
        <div id="s11-card" class="vm-end">
          <img class="vm-end-lockup" src="assets/brand/lockup-cor.svg" alt="Viva Mais">
          <p class="vm-end-line">Agende pelo app</p>
          <span class="vm-end-cta">vivamais.ai</span>
        </div>
      </div>
      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s11-fim"]');
          window.__timelines = window.__timelines || {};
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const m = VMMotion.create({ root, tl });
            m.plusReveal(0);
            m.end("#s11-card", 0.4);
            m.hold("#s11-card", 0.4, 3.6);
            window.__timelines["s11-fim"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
