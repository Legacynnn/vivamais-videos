        #ch10 .c10-ft { position: absolute; left: 16px; right: 16px; top: 764px; height: 52px; border-radius: 16px; background: #D8C8F8; }

                  <div class="c10-name"><b>Ana Souza</b><i></i><em id="c10-timer">00:01</em></div>
                  <div class="c10-pr" id="c10-btnPr">
                    <svg viewBox="0 0 24 24"><path d="M21 9V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h4" /><rect width="10" height="7" x="12" y="13" rx="2" /></svg>
                    Prontuário
                  </div>
                  <div class="c10-pip" id="c10-pip">
                    <video id="c10-vd" class="c10-vid" src="assets/video/doutora.mp4" muted playsinline data-start="3" data-duration="12.8" data-media-start="0" data-track-index="1"></video>
                    <span>Você</span>

                  <div class="c10-bar" id="c10-ctls">
                    <div class="c10-ctl" id="c10-mic">
                      <div class="c10-off"></div>
                      <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" x2="12" y1="19" y2="22" /></svg>
                      <div class="c10-slash"></div>
                    </div>
                    <div class="c10-ctl c10-end" id="c10-end"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></svg></div>
                    <div class="c10-ctl" id="c10-cam"><svg viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z" /><rect width="14" height="12" x="2" y="6" rx="2" /></svg></div>
                  </div>
                </div>

                <div class="scr c10-hub" id="c10-sHub">
                  <div class="c10-ttl">Prontuário</div>
                  <div class="c10-sk c10-s" style="left: 270px; top: 112px; width: 116px; height: 32px; border-radius: 16px;"></div>
                  <div class="c10-card c10-s" style="top: 170px; height: 88px;">
                    <div class="c10-sk" style="left: 16px; top: 20px; width: 48px; height: 48px; border-radius: 24px;"></div>
                    <div class="c10-sk" style="left: 80px; top: 26px; width: 140px; height: 14px;"></div>
                    <div class="c10-sk" style="left: 80px; top: 50px; width: 96px; height: 12px;"></div>
                  </div>
                  <div class="c10-card c10-s" style="top: 270px; height: 76px;">
                    <div class="c10-sk" style="left: 16px; top: 22px; width: 32px; height: 32px; border-radius: 10px;"></div>
                    <div class="c10-sk" style="left: 64px; top: 22px; width: 170px; height: 13px;"></div>
                    <div class="c10-sk" style="left: 64px; top: 44px; width: 220px; height: 11px;"></div>
                  </div>
                  <div class="c10-sk c10-s" style="left: 32px; top: 372px; width: 110px; height: 12px;"></div>
                  <div class="c10-card c10-s" id="c10-list" style="top: 396px; height: 300px;">
                    <div class="c10-sk" style="left: 16px; top: 13px; width: 24px; height: 24px; border-radius: 7px;"></div><div class="c10-sk" style="left: 54px; top: 18px; width: 112px; height: 13px;"></div><div class="c10-sk" style="right: 18px; top: 18px; width: 64px; height: 13px;"></div>
                    <div class="c10-sk" style="left: 16px; top: 63px; width: 24px; height: 24px; border-radius: 7px;"></div><div class="c10-sk" style="left: 54px; top: 68px; width: 96px; height: 13px;"></div><div class="c10-sk" style="right: 18px; top: 68px; width: 72px; height: 13px;"></div>
                    <div class="c10-sk" style="left: 16px; top: 113px; width: 24px; height: 24px; border-radius: 7px;"></div><div class="c10-sk" style="left: 54px; top: 118px; width: 70px; height: 13px;"></div><div class="c10-sk" style="right: 18px; top: 118px; width: 58px; height: 13px;"></div>
                    <div class="c10-sk" style="left: 16px; top: 163px; width: 24px; height: 24px; border-radius: 7px;"></div><div class="c10-sk" style="left: 54px; top: 168px; width: 84px; height: 13px;"></div><div class="c10-sk" style="right: 18px; top: 168px; width: 80px; height: 13px;"></div>
                    <div class="c10-sk" style="left: 16px; top: 213px; width: 24px; height: 24px; border-radius: 7px;"></div><div class="c10-sk" style="left: 54px; top: 218px; width: 76px; height: 13px;"></div><div class="c10-sk" style="right: 18px; top: 218px; width: 66px; height: 13px;"></div>
                    <div class="c10-sk" style="left: 16px; top: 263px; width: 24px; height: 24px; border-radius: 7px;"></div><div class="c10-sk" style="left: 54px; top: 268px; width: 90px; height: 13px;"></div><div class="c10-sk" style="right: 18px; top: 268px; width: 60px; height: 13px;"></div>

        <div id="c10-brand" class="clip" data-start="0" data-duration="20.5" data-track-index="3">

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="ch10-consulta"]');
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const k = VMKit.create({ root, tl });
            const { $, $$, E, tip, tap, center, push, showTip, titleCard } = k;
            const cam = $(".cam");
            const pad = (n) => (n < 10 ? "0" + n : "" + n);

            k.screens(["c10-sCall", "c10-sHub"]);
            tl.set(cam, { opacity: 0 }, 0);
            tl.set(cam, { opacity: 1 }, 3);

            titleCard("#c10-t1", { at: 0.15, sparkAt: 0.75, out: 2.78 });

            tl.fromTo(cam, { xPercent: 22 }, { xPercent: 0, duration: 0.8, ease: "power4.out" }, 3);

            const timer = $("#c10-timer");
            const tick = { n: 1 };
            tl.fromTo(tick, { n: 1 }, {
              n: 14,
              duration: 13,
              ease: "none",
              onUpdate() {
                timer.textContent = "00:" + pad(Math.floor(tick.n));
              },
            }, 3);

            tl.to(cam, { scale: 1.12, x: -40, y: 93, duration: 1.0, ease: "power2.inOut" }, 3.8);
            showTip(tip("Vídeo direto no app", 150, 470, "down"), 4.3, 2.2);

            tl.to(cam, { scale: 1.15, x: -60, y: -30, duration: 1.0, ease: "power2.inOut" }, 6.9);
            const pip = center("#c10-pip");
            showTip(tip("Você aparece aqui", pip.x, pip.p.y - 4, "up"), 7.6, 1.8);

            tl.to(cam, { scale: 1, x: 0, y: 0, duration: 0.8, ease: "power2.inOut" }, 9.7);

            const bar = center("#c10-ctls");
            showTip(tip("Mic e câmera à mão", 130, bar.p.y - 4, "up"), 10.2, 2.6);
            const mic = center("#c10-mic");
            const micEl = $("#c10-mic");
            tap(mic.x, mic.y, 10.8, micEl);
            tl.to(micEl.querySelector(".c10-off"), { opacity: 1, duration: 0.15 }, 10.8);
            tl.to(micEl.querySelector(".c10-slash"), { opacity: 1, duration: 0.15 }, 10.8);
            tap(mic.x, mic.y, 12.0, micEl);
            tl.to([micEl.querySelector(".c10-off"), micEl.querySelector(".c10-slash")], { opacity: 0, duration: 0.15 }, 12.0);

            tl.to(cam, { scale: 1.12, x: -90, y: 200, duration: 0.9, ease: "power2.inOut" }, 12.6);
            const pr = center("#c10-btnPr");
            const prEl = $("#c10-btnPr");
            tl.fromTo(prEl, { scale: 1 }, { scale: 1.08, duration: 0.35, ease: "back.out(2)", transformOrigin: "100% 50%" }, 13.2);
            showTip(tip("Prontuário a um toque", pr.x, pr.p.y + pr.p.h + 6, "down"), 13.3, 1.8);
            tl.to(prEl, { scale: 1, duration: 0.25, ease: "power2.out" }, 14.7);

            tap(pr.x, pr.y, 15.0, prEl);
            tl.to(cam, { scale: 1, x: 0, y: 0, duration: 0.7, ease: "power2.inOut" }, 15.1);
            push("c10-sCall", "c10-sHub", 15.2);
            tl.to($(".status"), { color: "#17151E", duration: 0.3 }, 15.3);
            tl.to($$(".status-icons i"), { backgroundColor: "#17151E", duration: 0.3 }, 15.3);

            const sk = $$(".c10-s");
            tl.fromTo(sk, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: E, stagger: 0.08 }, 15.55);
            tl.fromTo($("#c10-sweep"), { x: -140, opacity: 1 }, { x: 560, duration: 0.9, ease: "power1.inOut" }, 16.5);
            tl.set($("#c10-sweep"), { opacity: 0 }, 17.45);
            tl.fromTo($("#c10-sweep"), { x: -140, opacity: 1 }, { x: 560, duration: 0.9, ease: "power1.inOut", immediateRender: false }, 17.7);
            tl.set($("#c10-sweep"), { opacity: 0 }, 18.65);
            tl.to(cam, { scale: 1.05, y: 20, duration: 1.8, ease: "power2.inOut" }, 16.0);
            tl.to(cam, { scale: 1, y: 0, duration: 0.5, ease: "power2.inOut" }, 18.6);

            tl.to(cam, { xPercent: -24, duration: 0.42, ease: "power4.in" }, 19.7);
            tl.set(cam, { opacity: 0 }, 20.12);

            window.__timelines["ch10-consulta"] = tl;
          });
        })();
      </script>
    </template>
