          const root = document.querySelector('[data-composition-id="ch09-pre-consulta"]');
          document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });
            const k = VMKit.create({ root, tl, screenEl: root.querySelector("#c09-screen"), liftEl: root.querySelector("#c09-lift") });
            const { $, $$, E, center: dc, tap: dtap, showTip, tip } = k;
            const cam = $("#c09-cam"), sw = $("#c09-sw");
            const sB = $("#c09-sB"), sC = $("#c09-sC"), sc = $("#c09-sc");
            const status = $("#c09-status");

            k.screens(["c09-sA", "c09-sB", "c09-sC", "c09-sD"]);

            const lift = (kit, el, t, hold, dx, sc, o = {}) => {
              el = kit.$(el);
              const { node } = kit.finalClone(el);
              node.querySelectorAll(".c09-gone").forEach((n) => n.remove());
              Object.assign(node.firstElementChild.style, { position: "relative", left: "0px", top: "0px", right: "auto" });
              if (o.dy) node.style.top = parseFloat(node.style.top) + o.dy + "px";
              if (o.bg) node.style.background = o.bg;
              if (o.r) node.style.borderRadius = o.r;
              tl.set(el, { opacity: 0 }, t);
              tl.set(node, { opacity: 1 }, t);
              tl.fromTo(node, { scale: 1, x: 0, y: 0 }, { scale: sc, x: dx, y: -6, duration: 0.6, ease: E, immediateRender: false }, t);
              tl.to(node, { scale: 1, x: 0, y: 0, duration: 0.45, ease: "power3.inOut" }, t + hold);
              tl.set(node, { opacity: 0 }, t + hold + 0.45);
              tl.set(el, { opacity: 1 }, t + hold + 0.45);
              return node;
            };
            const padNode = (n, px, py) => {
              const l = parseFloat(n.style.left), t = parseFloat(n.style.top), w = parseFloat(n.style.width), h = parseFloat(n.style.height);
              Object.assign(n.style, { left: l - px + "px", top: t - py + "px", width: w + 2 * px + "px", height: h + 2 * py + "px", padding: py + "px " + px + "px" });
            };
            const punch = (t, s, y, d = 1) => tl.to(cam, { scale: s, y, duration: d, ease: "power2.inOut" }, t);
            const pop = (el, t, d = 0.5) => tl.fromTo(el, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: "back.out(1.7)", immediateRender: false }, t);
            const rise = (els, t, st = 0.08) => tl.fromTo(els, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: E, stagger: st, immediateRender: false }, t);
            const mkSk = (host, blocks) => {
              $(host).innerHTML = blocks.map(([x, y, w, h, r, c, cls]) => `<i${cls ? ` class="${cls}"` : ""} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;${c ? "background:" + c : ""}"></i>`).join("");
            };
            const skeleton = (id, t, end) => {
              const sk = $(id);
              const n = Math.max(1, Math.round((end - t) / 0.3) - 1);
              tl.fromTo(sk, { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, t);
              tl.fromTo(sk.querySelectorAll("i:not(.c09-bgr)"), { opacity: 0.55 }, { opacity: 1, duration: 0.3, repeat: n, yoyo: true, ease: "sine.inOut", immediateRender: false }, t);
              tl.to(sk, { opacity: 0, duration: 0.3 }, end);
            };
            mkSk("#c09-skB", [
              [0, 0, 402, 380, 0, "#6B2FD0", "c09-bgr"],
              [0, 317, 402, 557, 30, "#F3F4FA", "c09-bgr"],
              [20, 106, 52, 52, 26, "rgba(214,195,251,0.55)"],
              [20, 172, 190, 28, 10, "rgba(214,195,251,0.55)"],
              [20, 208, 120, 14, 6, "rgba(214,195,251,0.55)"],
              [20, 244, 250, 16, 6, "rgba(214,195,251,0.55)"],
              [20, 268, 180, 26, 8, "rgba(214,195,251,0.55)"],
              [20, 350, 140, 14, 6],
              [20, 404, 120, 14, 6],
              [20, 436, 362, 120, 18, "#fff"],
              [20, 590, 160, 16, 6],
              [20, 620, 362, 96, 20, "#fff"],
              [0, 760, 402, 114, 0, "#F3F4FA", "c09-bgr"],
              [20, 772, 362, 54, 16, "#E3E5F0"]
            ]);

            const seg = (a, from, to) => {
              let pos = 0, out = "";
              a.forEach(([s, b]) => {
                const lo = Math.max(from - pos, 0), hi = Math.min(to - pos, s.length);
                if (hi > lo) out += b ? `<b>${s.slice(lo, hi)}</b>` : s.slice(lo, hi);
                pos += s.length;
              });
              return out;
            };
            const ans = [["Ana, 34 anos. Ansiedade e insônia há 3 meses, cefaleia 6/10. Usa anticoncepcional oral. ", 0], ["Alergia a dipirona: evitar.", 1]];
            const total = ans.reduce((n, p) => n + p[0].length, 0);
            const abt = $("#c09-abt");
            const paint = (n) => (abt.innerHTML = `${seg(ans, 0, n)}<span class="c09-rest">${seg(ans, n, total)}</span>`);
            paint(0);
            const stream = { n: 0 };

            const pad2 = (n) => (n < 10 ? "0" + n : "" + n);
            const fmt = (s) => {
              const v = Math.max(0, Math.round(s));
              return "00:" + pad2(Math.floor(v / 60)) + ":" + pad2(v % 60);
            };
            const hcd = $("#c09-hcd"), fcd = $("#c09-fcd");
            const cd = { s: 72 };
            const cdSeg = (from, to, t, d, ease) =>
              tl.fromTo(cd, { s: from }, { s: to, duration: d, ease, immediateRender: false, onUpdate() { const x = fmt(cd.s); hcd.textContent = x; fcd.textContent = x; } }, t);

            const S1 = 170, S2 = 520, S3 = 640, S4 = 770;
            const scrollTo = (y, t, d) => tl.to(sc, { y: -y, duration: d, ease: "power1.inOut", immediateRender: false }, t);

            tl.set(sw, { x: 165, opacity: 0 }, 0);
            k.titleCard("#c09-t1", { at: 0.15, sparkAt: 0.75, out: 2.45 });

            tl.set(sw, { opacity: 1 }, 2.9);
            tl.fromTo(sw, { x: 165 }, { x: 0, duration: 0.8, ease: "power4.out", immediateRender: false }, 2.9);

            const nc = k.posIn($("#c09-nc"));
            punch(3.7, 1.05, 12, 0.8);
            lift(k, "#c09-nc", 3.8, 1.0, 0, 1.08, { r: "26px", bg: "transparent" });
            showTip(tip("Começa em 2 minutos", nc.x + nc.w / 2, nc.y + nc.h + 18, "down"), 4.1, 0.75);

            const arw = dc("#c09-arw");
            dtap(arw.x, arw.y, 5.3, $("#c09-arw"));
            punch(5.2, 1, 0, 0.5);
            k.push("c09-sA", "c09-sB", 5.45);
            skeleton("#c09-skB", 5.45, 6.1);

            cdSeg(72, 52.8, 5.45, 19.2, "none");
            cdSeg(52.8, 5, 24.5, 1.0, "power2.inOut");
            cdSeg(5, 0, 25.6, 1.7, "none");

            const sheet = $("#c09-sheet");
            tl.fromTo(sheet, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: E, immediateRender: false }, 6.0);
            pop($("#c09-hav"), 5.95, 0.5);
            rise([$("#c09-hn"), $("#c09-hs"), $("#c09-hf"), $("#c09-cd")], 6.05, 0.08);
            pop($("#c09-st"), 6.65, 0.45);

            punch(6.0, 1.06, 70, 0.9);
            const cdp = k.posIn($("#c09-cd"));
            showTip(tip("Contagem ao vivo", 290, cdp.y + 14, "up"), 6.6, 1.05);
            punch(7.5, 1.04, 20, 0.7);

            scrollTo(S1, 7.6, 0.95);
            tl.to(status, { color: "#17151E", duration: 0.2 }, 8.0);
            tl.to($("#c09-hds"), { opacity: 1, duration: 0.2 }, 8.0);
            tl.to($("#c09-hbar"), { color: "#17151E", duration: 0.2 }, 8.0);

            const ap = k.posIn($("#c09-ap"));
            const apn = lift(k, "#c09-ap", 8.75, 1.3, 0, 1.05, { dy: -S1, bg: "#fff", r: "20px" });
            padNode(apn, 14, 6);
            showTip(tip("O que importa, em destaque", ap.x + ap.w / 2, ap.y + ap.h - S1 + 18, "down"), 9.05, 0.95);

            const ai = k.posIn($("#c09-ai"));
            const ain = lift(k, "#c09-ai", 10.5, 1.3, 0, 1.05, { dy: -S1, bg: "#fff", r: "22px" });
            padNode(ain, 12, 10);
            showTip(tip("Pergunte à IA antes de entrar", ai.x + ai.w / 2, ai.y + ai.h - S1 + 24, "down"), 10.8, 0.95);

            const chip = dc("#c09-chip1");
            const chipEl = $("#c09-chip1");
            dtap(chip.x, chip.y - S1, 12.35, chipEl);
            tl.to(chipEl, { backgroundColor: "#D6C3FB", duration: 0.12 }, 12.35);
            tl.to(chipEl, { backgroundColor: "#EDE3FD", duration: 0.3 }, 12.9);
            punch(12.3, 1, 0, 0.5);
            k.push("c09-sB", "c09-sC", 12.5);

            tl.set($("#c09-ub"), { opacity: 0 }, 0);
            punch(13.1, 1.05, 70, 0.9);
            tl.to($("#c09-ctx"), { opacity: 0, y: -10, duration: 0.3 }, 13.25);
            tl.fromTo($("#c09-ub"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: E, immediateRender: false }, 13.3);
            tl.fromTo($("#c09-sCtx"), { opacity: 1 }, { opacity: 0, duration: 0.2, immediateRender: false }, 13.6);
            tl.fromTo($("#c09-sThk"), { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 13.65);
            tl.fromTo($("#c09-ab"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: E, immediateRender: false }, 13.9);
            tl.fromTo($("#c09-dots"), { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 14.0);
            tl.fromTo($$("#c09-dots i"), { y: 0, opacity: 0.4 }, { y: -5, opacity: 1, duration: 0.3, repeat: 3, yoyo: true, ease: "sine.inOut", stagger: 0.12, immediateRender: false }, 14.0);
            tl.to($("#c09-dots"), { opacity: 0, duration: 0.15 }, 15.1);
            tl.to($("#c09-sThk"), { opacity: 0, duration: 0.2 }, 15.1);
            tl.fromTo($("#c09-sWrt"), { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 15.2);
            tl.fromTo(stream, { n: 0 }, { n: total, duration: 2.5, ease: "none", immediateRender: false, onUpdate() { paint(Math.round(stream.n)); } }, 15.3);
            tl.to($("#c09-sWrt"), { opacity: 0, duration: 0.2 }, 17.8);
            tl.fromTo($("#c09-sCtx"), { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, 17.9);
            tl.fromTo($("#c09-abtm"), { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, 17.85);
            tl.fromTo($("#c09-aba"), { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 17.9);

            const absel = k.posIn($("#c09-ab"));
            showTip(tip("Resumo pronto em segundos", 200, absel.y + absel.h - 24, "down"), 18.0, 1.05);

            const bk = dc("#c09-chBack");
            dtap(bk.x, bk.y, 19.35, $("#c09-chBack"));
            punch(19.3, 1, 0, 0.5);
            tl.set(sB, { autoAlpha: 1 }, 19.45);
            tl.fromTo(sB, { x: -120 }, { x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 19.45);
            tl.fromTo(sC, { x: 0 }, { x: 402, duration: 0.5, ease: "power3.out", immediateRender: false }, 19.45);
            tl.set(sC, { autoAlpha: 0 }, 19.97);

            scrollTo(S2, 20.0, 0.8);
            punch(20.8, 1.06, 40, 0.8);
            const an = k.posIn($("#c09-an"));
            lift(k, "#c09-an", 21.0, 1.3, 0, 1.06, { dy: -S2, r: "22px" });
            showTip(tip("O paciente já contou o caso", an.x + an.w / 2, an.y + an.h - S2 + 12, "down"), 21.3, 1.0);

            scrollTo(S3, 22.7, 0.9);
            punch(22.7, 1.04, 0, 0.8);
            const pac = k.posIn($("#c09-pac"));
            showTip(tip("Lembre ou cobre o paciente", pac.x + pac.w / 2, pac.y - S3 - 4, "up"), 23.7, 1.0);
            scrollTo(S4, 24.5, 0.9);
            punch(24.6, 1, 0, 0.6);

            tl.fromTo($("#c09-flash"), { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, 24.5);
            tl.to($("#c09-flash"), { opacity: 0, duration: 0.5 }, 24.65);
            tl.fromTo($("#c09-skip"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: E, immediateRender: false }, 24.7);
            tl.to($("#c09-skip"), { opacity: 0, duration: 0.3 }, 26.2);
            tl.set($("#c09-clock"), { textContent: "13:59" }, 17.2);
            tl.set($("#c09-clock"), { textContent: "14:00" }, 25.5);

            tl.to($("#c09-con"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 27.3);
            tl.fromTo($("#c09-cta"), { scale: 1 }, { scale: 1.04, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 27.3);
            punch(27.2, 1.07, -50, 0.8);
            const cta = dc("#c09-cta");
            showTip(tip("Abre na hora marcada", cta.x, cta.p.y - 8, "up"), 27.7, 1.0);

            dtap(cta.x, cta.y, 29.0, $("#c09-cta"));
            punch(29.1, 1, 0, 0.5);
            k.push("c09-sB", "c09-sD", 29.2);
            tl.to(status, { color: "#FFFFFF", duration: 0.2 }, 29.3);
            tl.to($("#c09-homebar"), { opacity: 0, duration: 0.1 }, 29.3);
            [$("#c09-rg1"), $("#c09-rg2")].forEach((r, i) => {
              tl.fromTo(r, { scale: 1, opacity: 0.8 }, { scale: 1.7, opacity: 0, duration: 1.0, repeat: 2, ease: "power1.out", immediateRender: false }, 29.5 + i * 0.5);
            });
            tl.fromTo($$("#c09-cdots i"), { opacity: 0.35 }, { opacity: 1, duration: 0.3, repeat: 5, yoyo: true, stagger: 0.15, immediateRender: false }, 29.6);

            tl.to(sw, { x: -176, duration: 0.42, ease: "power4.in" }, 31.5);
            tl.set(sw, { opacity: 0 }, 31.93);

            $$("#c09-screen, #c09-screen *, #c09-lift, #c09-lift *").forEach((n) => ["overlap", "occlusion", "overflow"].forEach((a) => n.setAttribute("data-layout-allow-" + a, "")));

            window.__timelines["ch09-pre-consulta"] = tl;
          });
        })();
      </script>
    </template>
  </body>
</html>
