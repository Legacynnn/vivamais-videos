        (function () {

            const tl = gsap.timeline({ paused: true });

              n.setAttribute("data-layout-allow-overlap", "");

            const GROUND = "#F3F4FA";

            const padLift = (node, p, n) => {
              node.style.left = p.x - n + "px";
              node.style.top = p.y - n + "px";
              node.style.width = p.w + 2 * n + "px";
              node.style.height = p.h + 2 * n + "px";
              node.style.padding = n + "px";
              node.style.background = GROUND;
            };

            const grp1 = $("#c11-grp1");
            const g1 = center(grp1);
            const lg = liftOut(grp1, 4.9, 2.3, 0, 1.04);
            padLift(lg, g1.p, 8);
            showTip(tip("Tudo da consulta num lugar", g1.x, g1.p.y + g1.p.h + 18, "down"), 5.2, 1.85);

            const alg = $("#c11-alg");
            const a1 = center(alg);
            const la = liftOut(alg, 9.6, 2.3, 0, 1.08);
            padLift(la, a1.p, 10);
            showTip(tip("Alergia a dipirona: atenção", a1.x, a1.p.y + a1.p.h + 20, "down"), 9.9, 1.85);

            const lcE = $("#c11-lcE");
            const l1 = center(lcE);

            ll.style.overflow = "hidden";
            Object.assign(ll.firstChild.style, { position: "relative", left: "0px", top: "0px" });
            showTip(tip("Códigos TUSS automáticos", l1.x, l1.p.y + l1.p.h + 14, "down"), 34.9, 1.55);

            const rRc = $("#c11-rRc");
            const r1 = center(rRc);
            const lr = liftOut(rRc, 54.9, 2.8, 0, 1.06);
            lr.style.overflow = "hidden";
            showTip(tip("Agora, a receita", r1.x, r1.p.y + r1.p.h + 12, "down"), 55.2, 2.35);

            const P = {};
            [["An", "rAn"], ["Dx", "rDx"], ["Ex", "rEx"], ["La", "rLa"], ["At", "rAt"]].forEach(([n, id]) => { P[n] = center($("#c11-" + id)); });
            const BK = {};
            ["A", "D", "E", "C", "L"].forEach((s) => { BK[s] = center($("#c11-bk" + s)); });
            const SV = {};
            ["D", "E", "C", "L"].forEach((s) => { SV[s] = center($("#c11-sv" + s)); });
            const RW = {};
            ["D1", "D2", "1", "2", "3", "4"].forEach((s) => { RW[s] = center($("#c11-rw" + s)); });

            ["D1", "D2", "E"].forEach((s) => { SF[s] = center($("#c11-sf" + s)); });
            const TA = {};
            ["E", "C", "L"].forEach((s) => { TA[s] = center($("#c11-ta" + s)); });
            const IFC = center($("#c11-ifC"));

            k.screens(["c11-sH", "c11-sA", "c11-sD", "c11-sE", "c11-sC", "c11-sL"]);

            titleCard("#c11-t1", { at: 0.15, sparkAt: 0.75, out: 2.58 });
            tl.fromTo(cam, { xPercent: 22 }, { xPercent: 0, duration: 0.8, ease: "power4.out" }, 3);

              n: 55.4,
              duration: 55.4,
              ease: "none",
              onUpdate() {
                const s = 492 + Math.floor(clock.n);
                tm.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
              },

            const shine = (el, t, d) => tl.fromTo(el, { x: -200 }, { x: 560, duration: d, ease: "power1.inOut" }, t);
            shine($("#c11-shH"), 3.0, 0.7);
            tl.to($("#c11-skH"), { opacity: 0, duration: 0.3 }, 3.7);
            tl.set($("#c11-skH"), { display: "none" }, 4.02);
            $$(".c11-e").forEach((el, i) => {
              tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 3.75 + i * 0.1);

            const press = (row, t) => {
              const p = $(row).querySelector(".c11-ps");

            const openRow = (c, id, to, tTap) => {
              tap(c.x, c.y, tTap, id);
              press(id, tTap);
              push("c11-sH", to, tTap + 0.2);

            const back = (from, c, tTap) => {
              if (c) tap(c.x, c.y, tTap, null);

              tl.set($("#" + from), { autoAlpha: 0 }, tTap + 0.72);
            };
            const flip = (id, t, hasDetail) => {
              const r = $(id);
              tl.fromTo(r.querySelector(".c11-fl"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, t);
              tl.to(r.querySelector(".c11-fl"), { opacity: 0, duration: 0.7 }, t + 0.3);
              tl.to(r.querySelector(".c11-v:not(.c11-alt)"), { opacity: 0, duration: 0.2 }, t);
              tl.fromTo(r.querySelector(".c11-alt"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: E }, t + 0.05);
              if (hasDetail) {
                tl.to(r.querySelector(".c11-vs"), { y: -9, duration: 0.3, ease: E }, t);
                tl.to(r.querySelector(".c11-lb"), { y: -9, duration: 0.3, ease: E }, t);
                tl.fromTo(r.querySelector(".c11-dt"), { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.3, ease: E }, t + 0.1);
              }
            };
            const saveBtn = (s, t) => {
              const b = $("#c11-sv" + s);
              tap(SV[s].x, SV[s].y, t, b);
              tl.set(b.querySelector(".c11-l1"), { opacity: 0 }, t + 0.1);
              tl.set(b.querySelector(".c11-l2"), { opacity: 1 }, t + 0.1);
              tl.set(b.querySelector(".c11-sp"), { opacity: 1 }, t + 0.1);
              tl.fromTo(b.querySelector(".c11-sp"), { rotation: 0 }, { rotation: 540, duration: 0.8, ease: "none" }, t + 0.1);
            };
            const typeTo = (f, full, t, dur, o) => {
              o = o || {};
              const v = f.querySelector(".c11-tv");
              const st = { n: 0 };
              const cutP = o.cut ? o.cut[0] : 0;
              const cutN = o.cut ? o.cut[1] : 0;
              const ease = o.cut
