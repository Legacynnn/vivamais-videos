          const TAP_FIN2 = T_SB + 1.5;
          const sd = center("#c13-svD");
          tap(sd.x, sd.y, TAP_FIN2, "#c13-svD");
          SET($("#c13-lD1"), { opacity: 0 }, TAP_FIN2 + 0.1);
          SET($("#c13-lD2"), { opacity: 1 }, TAP_FIN2 + 0.1);
          SET($("#c13-spD"), { opacity: 1 }, TAP_FIN2 + 0.1);
          spin($("#c13-spD"), TAP_FIN2 + 0.1, 1.4);
          nodeDone(4, TAP_FIN2 + 0.2);

          const P_IN = TAP_FIN2 + 1.0;
          SET(pcam, { x: PSMALL.x + 760, y: PSMALL.y, scale: PSMALL.scale, opacity: 0 }, 0);
          FT(pcam, { x: PSMALL.x + 760, opacity: 0 }, { x: PSMALL.x, opacity: 1, duration: 0.9, ease: "power4.out" }, P_IN);
          FT(cam, { opacity: 1 }, { opacity: 0.5, duration: 0.6 }, P_IN);
          const pu = $("#c13-push");
          const B0 = P_IN + 0.9;
          FT(pu, { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" }, B0);
          FT(pu, { opacity: 1, y: 0 }, { opacity: 0, y: -70, duration: 0.4, ease: "power2.in" }, B0 + 1.9);

          const kp = VMKit.create({ root, tl, screenEl: $("#c13-pscr"), liftEl: $("#c13-plift") });
          const F0 = B0 + 1.1;
          DOCS.forEach((d, i) => {
            const row = $("#c13-P" + i);
            const tilePos = kp.center($("#c13-P" + i + " .c13-ptl"));
            const tr = toRoot(PSMALL, tilePos.x, tilePos.y);
            const tf = F0 + i * 0.4;
            moveDoc(i, tf, 0.85, pose(tr.x, tr.y, 0.12, 0), { ease: "power3.inOut" });
            SET(d.el, { opacity: 0 }, tf + 0.85);
            FT(row, { opacity: 0, y: 14, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, tf + 0.7);
            FT(row.querySelector(".c13-ptl"), { scale: 1 }, { scale: 1.22, duration: 0.15, ease: "power2.out" }, tf + 0.85);
            FT(row.querySelector(".c13-ptl"), { scale: 1.22 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, tf + 1.0);
          });
          FT($("#c13-pEmpty"), { opacity: 1 }, { opacity: 0, duration: 0.3 }, F0 + 0.5);
          FT($("#c13-pHoje"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, F0 + 0.6);
          const F_END = F0 + 6 * 0.4 + 1.3;
          const rpl = toRoot(PSMALL, 200, 34);
          showStip(stip("Ana recebe tudo no app", rpl.x, rpl.y - 4, "up"), F_END, 2.7);

          const X0 = F_END + 3.0;
          FT(cam, { x: SMALL.x, opacity: 0.5 }, { x: SMALL.x - 170, opacity: 0, duration: 0.45, ease: "power4.in" }, X0);
          FT(pcam, { x: PSMALL.x, opacity: 1 }, { x: PSMALL.x - 170, opacity: 0, duration: 0.45, ease: "power4.in" }, X0);
          FT(stp, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in" }, X0);
          const TOTAL = Math.round((X0 + 0.7) * 100) / 100;

          root.querySelectorAll("#c13-phone *, #c13-pat *, #c13-stage *").forEach((n) => { n.setAttribute("data-layout-allow-overlap", ""); n.setAttribute("data-layout-allow-occlusion", ""); n.setAttribute("data-layout-allow-overflow", ""); });
          window.__timelines["ch13-assinatura"] = tl;
          });
        })();
      </script>
    </template>
  </body>
